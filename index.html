                    <div className="flex gap-2">

                        <ICONS.Send className="w-4 h-4" /> {testSending ? 'Sending...' : 'Send Test'}
                      </button>
                    </div>

                    <div className="flex gap-2">
                      <input type="text" value={overdueRecipients} onChange={e => setOverdueRecipients(e.target.value)} placeholder="Overdue alert recipients (comma-separated emails)" className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />

                <div className={`p-3 rounded-lg text-sm ${backupMessage.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>

                <div className="space-y-5">
                  <div className="flex items-center gap-3">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={!!backupSettings.enabled}
                        onChange={e => handleBackupChange('enabled', e.target.checked)}

    function AIAgentPanel({ isOpen, onClose, projects, activity, departments, currentUser }) {
      const [messages, setMessages] = useState([
        { role: 'agent', text: `Hi ${currentUser?.name?.split(' ')[0] || 'there'}! I'm your Process Automation AI Assistant. Ask me about projects, departments, progress, or deadlines.`, time: new Date() }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = React.useRef(null);

      const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      React.useEffect(scrollToBottom, [messages]);

      function generateResponse(text) {
        const lower = text.toLowerCase();
        const words = lower.split(/\s+/);

        // Greeting
        if (/\b(hi|hello|hey|good morning|good afternoon)\b/.test(lower)) {
          return `Hello! I'm ready to help. You can ask me things like:\n• "How many projects do we have?"\n• "Show me projects by InFlex"\n• "Which projects are overdue?"\n• "What is the average progress?"`;
        }

        // Help
        if (/\b(help|what can you do|commands)\b/.test(lower)) {
          return `Here's what I can help you with:\n• Project counts and statistics\n• Department breakdowns\n• Overdue project alerts\n• Project stage distribution\n• User and role information\n• Priority and status summaries\nJust ask in natural language!`;
        }

        // Total projects count
        if (/\b(how many|total number of|count of)\b.*\b(project|projects)\b/.test(lower) || /\b(project|projects)\b.*\b(count|total)\b/.test(lower)) {
          const total = projects.length;
          const byStage = {};
          STAGES.forEach(s => byStage[s] = projects.filter(p => getProjectStage(p) === s).length);
          return `We have **${total} projects** total.\nBy stage:\n${STAGES.map(s => `• ${s}: ${byStage[s]}`).join('\n')}`;
        }

        // Projects by department
        if (/\b(departments?|teams?)\b.*\b(project|projects)\b/.test(lower) || /\b(project|projects)\b.*\b(departments?|teams?)\b/.test(lower) || /\b(show|list|what are)\b.*\b(departments?|teams?)\b/.test(lower)) {
          const depts = {};
          projects.forEach(p => { depts[p.department_name] = (depts[p.department_name] || 0) + 1; });
          const sorted = Object.entries(depts).sort((a, b) => b[1] - a[1]);
          return `Projects by department:\n${sorted.map(([d, c]) => `• ${d}: ${c} project${c > 1 ? 's' : ''}`).join('\n')}`;
        }

        // Specific department
        const deptMatch = DEPARTMENTS.find(d => lower.includes(d.toLowerCase()));
        if (deptMatch) {
          const deptProjects = projects.filter(p => p.department_name === deptMatch);
          if (deptProjects.length === 0) return `No projects found for ${deptMatch}.`;
          const avgProgress = Math.round(deptProjects.reduce((s, p) => s + (parseFloat(p.progress) || 0), 0) / deptProjects.length);
          return `${deptMatch} has **${deptProjects.length} projects**:\n${deptProjects.slice(0, 5).map(p => `• ${p.project_name} (${getProjectStage(p)}, ${p.progress}%)`).join('\n')}${deptProjects.length > 5 ? '\n...and ' + (deptProjects.length - 5) + ' more.' : ''}\n\nAverage progress: **${avgProgress}%**`;
        }

        // Overdue projects
        if (/\b(overdue|late|missed|past due)\b/.test(lower)) {
          const now = new Date();
          const overdue = projects.filter(p => {
            if (!p.due_date) return false;
            const d = new Date(p.due_date);
            return d < now && p.status !== 'Completed';
          });
          if (overdue.length === 0) return `Great news! No overdue projects at the moment.`;
          return `**${overdue.length} project${overdue.length > 1 ? 's are' : ' is'} overdue**:\n${overdue.map(p => `• ${p.project_name} (Due: ${formatDate(p.due_date)}, Owner: ${p.owner_name})`).join('\n')}`;
        }

        // Average progress
        if (/\b(average|avg|mean)\b.*\b(progress|completion)\b/.test(lower) || /\b(progress|completion)\b.*\b(average|avg|mean)\b/.test(lower)) {
          if (projects.length === 0) return 'No projects to calculate progress.';
          const avg = Math.round(projects.reduce((s, p) => s + (parseFloat(p.progress) || 0), 0) / projects.length);
          const max = projects.reduce((m, p) => Math.max(m, parseFloat(p.progress) || 0), 0);
          const min = projects.reduce((m, p) => Math.min(m, parseFloat(p.progress) || 0), 100);
          return `Average progress across all projects: **${avg}%**\nHighest: **${max}%**\nLowest: **${min}%**`;
        }

        // Status breakdown
        if (/\b(status|on track|at risk|delayed|completed)\b/.test(lower)) {
          const byStatus = {};
          projects.forEach(p => { byStatus[p.status] = (byStatus[p.status] || 0) + 1; });
          return `Project status breakdown:\n${Object.entries(byStatus).map(([s, c]) => `• ${s}: ${c}`).join('\n')}`;
        }

        // Priority
        if (/\b(priority|critical|high|medium|low)\b/.test(lower)) {
          const byPriority = {};
          projects.forEach(p => { byPriority[p.priority] = (byPriority[p.priority] || 0) + 1; });
          const order = ['Critical', 'High', 'Medium', 'Low'];
          return `Projects by priority:\n${order.map(p => `• ${p}: ${byPriority[p] || 0}`).join('\n')}`;
        }

        // Recent activity
        if (/\b(recent|latest|last|activity|updates?)\b/.test(lower)) {
          const recent = activity.slice(0, 5);
          if (recent.length === 0) return 'No recent activity recorded.';
          return `Recent activity:\n${recent.map(a => `• ${a.description} (${a.user_name}, ${a.created_at ? new Date(a.created_at).toLocaleDateString() : 'Just now'})`).join('\n')}`;
        }

        // Specific project search
        const projMatch = projects.find(p => lower.includes(p.project_name.toLowerCase()) || lower.includes(p.project_name.toLowerCase().replace(/\s+/g, '')));
        if (projMatch) {
          return `**${projMatch.project_name}**\n• Department: ${projMatch.department_name}\n• Owner: ${projMatch.owner_name}\n• Stage: ${getProjectStage(projMatch)}\n• Progress: ${projMatch.progress}%\n• Priority: ${projMatch.priority}\n• Status: ${projMatch.status}\n• Start: ${formatDate(projMatch.start_date)}\n• Due: ${formatDate(projMatch.due_date)}`;
        }

        // Users
        if (/\b(users?|people|team members?|staff)\b/.test(lower)) {
          return `There are currently users managing projects across ${departments.length} departments. The dashboard supports role-based access with Admin and User roles.`;
        }

        // Owner / specific person
        const ownerNames = [...new Set(projects.map(p => p.owner_name).filter(Boolean))];
        const ownerMatch = ownerNames.find(o => lower.includes(o.toLowerCase()));
        if (ownerMatch) {
          const ownerProjects = projects.filter(p => p.owner_name === ownerMatch);
          return `${ownerMatch} owns **${ownerProjects.length} project${ownerProjects.length > 1 ? 's' : ''}**:\n${ownerProjects.map(p => `• ${p.project_name} (${getProjectStage(p)}, ${p.progress}%)`).join('\n')}`;
        }

        // Summary / overview
        if (/\b(summary|overview|snapshot|status report)\b/.test(lower)) {
          const total = projects.length;
          const avg = total > 0 ? Math.round(projects.reduce((s, p) => s + (parseFloat(p.progress) || 0), 0) / total) : 0;
          const overdue = projects.filter(p => p.due_date && new Date(p.due_date) < new Date() && p.status !== 'Completed').length;
          const atRisk = projects.filter(p => p.status === 'At Risk' || p.status === 'Delayed').length;
          return `**Dashboard Summary**\n• Total Projects: ${total}\n• Average Progress: ${avg}%\n• Overdue: ${overdue}\n• At Risk / Delayed: ${atRisk}\n• Departments: ${departments.length}\n• Recent Updates: ${activity.length} activities`;
        }

        return `I'm not sure I understood that. Try asking about:\n• Project counts or statistics\n• Department breakdowns\n• Overdue projects\n• Average progress\n• Specific project names\n• Recent activity`;
      }

      const handleSend = () => {
        if (!input.trim()) return;
        const userMsg = { role: 'user', text: input.trim(), time: new Date() };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const response = generateResponse(userMsg.text);
          setMessages(prev => [...prev, { role: 'agent', text: response, time: new Date() }]);
          setIsTyping(false);
        }, 600 + Math.random() * 400);
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-y-0 right-0 z-40 w-96 bg-white border-l border-slate-200 shadow-2xl flex flex-col animate-slide-in-right">
          {/* Header */}
          <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-violet-600 to-fuchsia-600">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
                <ICONS.Sparkles className="w-4 h-4 text-white" />
              </div>
              <div>
                <h3 className="text-sm font-bold text-white">AI Assistant</h3>
                <p className="text-[10px] text-white/70">Process Automation Insights</p>
              </div>
            </div>
            <button onClick={onClose} className="p-1.5 rounded-lg text-white/70 hover:text-white hover:bg-white/10 transition">
              <ICONS.Close className="w-4 h-4" />
            </button>
          </div>

          {/* Messages */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
            {messages.map((msg, i) => (
              <div key={i} className={`flex gap-2.5 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                <div className={`w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center ${
                  msg.role === 'user' ? 'bg-primary-100 text-primary-700' : 'bg-gradient-to-br from-violet-500 to-fuchsia-500 text-white'
                }`}>
                  {msg.role === 'user' ? <ICONS.User className="w-3.5 h-3.5" /> : <ICONS.Bot className="w-3.5 h-3.5" />}
                </div>
                <div className={`max-w-[80%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-line ${
                  msg.role === 'user'
                    ? 'bg-primary-600 text-white rounded-tr-sm'
                    : 'bg-white border border-slate-100 text-slate-700 shadow-sm rounded-tl-sm'
                }`}>
                  {msg.text.split(/(\*\*.*?\*\*)/).map((part, j) =>
                    part.startsWith('**') && part.endsWith('**')
                      ? <strong key={j} className={msg.role === 'user' ? 'text-white' : 'text-slate-900'}>{part.slice(2, -2)}</strong>
                      : part
                  )}
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="flex gap-2.5">
                <div className="w-7 h-7 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-white">
                  <ICONS.Bot className="w-3.5 h-3.5" />
                </div>
                <div className="bg-white border border-slate-100 px-4 py-2.5 rounded-2xl rounded-tl-sm shadow-sm">
                  <div className="flex gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 animate-bounce" style={{ animationDelay: '0ms' }} />
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 animate-bounce" style={{ animationDelay: '150ms' }} />
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 animate-bounce" style={{ animationDelay: '300ms' }} />
                  </div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Input */}
          <div className="p-3 border-t border-slate-100 bg-white">
            <div className="flex gap-2">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Ask about projects, stats, deadlines..."
                className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
              />
              <button
                onClick={handleSend}
                disabled={!input.trim() || isTyping}
                className="p-2.5 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl transition shadow-sm"
              >
                <ICONS.Send className="w-4 h-4" />
              </button>
            </div>
            <p className="text-[10px] text-slate-400 mt-1.5 text-center">Press Enter to send · AI responses are generated from dashboard data</p>
          </div>

    function OnboardingTour({ isOpen, onComplete, steps }) {
      const [stepIndex, setStepIndex] = useState(0);
      const [rect, setRect] = useState(null);
      const [placement, setPlacement] = useState('center');
      const tooltipRef = useRef(null);

      useEffect(() => {
        if (isOpen) setStepIndex(0);
      }, [isOpen]);

      useEffect(() => {
        if (!isOpen) return;
        const step = steps[stepIndex];
        const update = () => {
          if (!step || !step.target) {
            setRect(null);
            setPlacement('center');
            return;
          }
          const el = document.querySelector(step.target);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const pad = 8;
            const r = el.getBoundingClientRect();
            setRect({ left: r.left - pad, top: r.top - pad, width: r.width + pad * 2, height: r.height + pad * 2 });
            setPlacement(window.innerHeight - r.bottom > 300 ? 'bottom' : 'top');
          } else {
            setRect(null);
            setPlacement('center');
          }
        };
        update();
        window.addEventListener('resize', update);
        window.addEventListener('scroll', update, true);
        return () => {
          window.removeEventListener('resize', update);
          window.removeEventListener('scroll', update, true);
        };
      }, [isOpen, stepIndex, steps]);

      if (!isOpen || !steps.length) return null;

      const step = steps[stepIndex];
      const isLast = stepIndex === steps.length - 1;

      const handleNext = () => {
        if (isLast) {
          onComplete && onComplete();
        } else {
          setStepIndex(i => i + 1);
        }
      };

      const handleBack = () => setStepIndex(i => Math.max(0, i - 1));
      const handleSkip = () => onComplete && onComplete();

      const maxLeft = Math.max((typeof window !== 'undefined' ? window.innerWidth : 0) - 336, 16);
      const tooltipStyle = rect
        ? {
            left: Math.min(Math.max(16, rect.left + rect.width / 2 - 160), maxLeft),
            top: placement === 'bottom' ? rect.top + rect.height + 16 : rect.top - 16
          }
        : {
            left: '50%',
            top: '50%',
            transform: 'translate(-50%, -50%)'
          };

      return (
        <div className="fixed inset-0 z-[60]">
          {rect && (
            <div
              className="absolute rounded-xl pointer-events-none transition-all duration-300"
              style={{ left: rect.left, top: rect.top, width: rect.width, height: rect.height, boxShadow: '0 0 0 9999px rgba(15, 23, 42, 0.65)' }}
            />
          )}
          <div
            ref={tooltipRef}
            className={`absolute bg-white rounded-2xl shadow-2xl border border-slate-100 p-5 w-80 max-w-[calc(100vw-32px)] transition-all duration-300 ${placement === 'top' && rect ? '-translate-y-full' : ''}`}
            style={tooltipStyle}
          >
            <div className="flex items-start justify-between mb-3">
              <h3 className="text-base font-bold text-slate-800">{step.title}</h3>
              <span className="text-xs text-slate-400">{stepIndex + 1}/{steps.length}</span>
            </div>
            <p className="text-sm text-slate-600 leading-relaxed mb-5">{step.content}</p>
            <div className="flex items-center justify-between">
              <button onClick={handleSkip} className="text-xs text-slate-400 hover:text-slate-600 font-medium">Skip tour</button>
              <div className="flex items-center gap-2">
                {stepIndex > 0 && (
                  <button onClick={handleBack} className="px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 rounded-lg transition">Back</button>
                )}
                <button onClick={handleNext} className="px-4 py-2 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 rounded-lg transition shadow-sm">
                  {isLast ? 'Get started' : 'Next'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [projectsFilter, setProjectsFilter] = useState({ status: 'All', stage: 'All', priority: 'All', dept: 'All' });
      const [projects, setProjects] = useState([]);
      const [users, setUsers] = useState([]);
      const [activity, setActivity] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [modalOpen, setModalOpen] = useState(false);
      const [modalType, setModalType] = useState(null);
      const [editingItem, setEditingItem] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [deleteType, setDeleteType] = useState(null);
      const [confirmSave, setConfirmSave] = useState(null);
      const [saveBusy, setSaveBusy] = useState(false);
      const [logoutConfirm, setLogoutConfirm] = useState(false);
      const [aiPanelOpen, setAiPanelOpen] = useState(false);
      const [backendUrl, setBackendUrl] = useState(() => localStorage.getItem('pad_api_url') || '');
      const [showBackendConfig, setShowBackendConfig] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [showTour, setShowTour] = useState(false);

      const tourSteps = [
        { title: 'Welcome', content: 'This is the Process Automation Dashboard. Let\'s take a quick walkthrough of the main areas.' },
        { target: '[data-tour="dashboard"]', title: 'Navigation', content: 'Use the sidebar to switch between Dashboard, Projects, Reports, Users, and Settings.' },
        { target: '[data-tour="kpis"]', title: 'Dashboard KPIs', content: 'These cards show your project totals, completed count, average progress, and at-risk or delayed projects. Click any card to filter projects.' },
        { target: '[data-tour="projects"]', title: 'Projects', content: 'Manage all automation workflows here. Search, filter by department, stage, priority, or status, and export to Excel or PDF.' },
        { target: '[data-tour="reports"]', title: 'Reports & Analytics', content: 'View breakdowns by stage, department, and status. Export reports for sharing or offline review.' },
        { target: '[data-tour="ai-assistant"]', title: 'AI Assistant', content: 'Ask the AI about project counts, deadlines, department breakdowns, and more.' },
        { target: '[data-tour="help-button"]', title: 'Need help?', content: 'Tap this question mark button anytime to restart the tour.' }
      ];

      const handleTourComplete = () => {
        setShowTour(false);
        try { localStorage.setItem('pad_onboarding_seen', '1'); } catch (e) {}
      };

      const handleKpiClick = useCallback((type) => {
        if (type === 'total') setProjectsFilter({ status: 'All', stage: 'All', priority: 'All', dept: 'All' });
        else if (type === 'completed') setProjectsFilter({ status: 'Completed', stage: 'All', priority: 'All', dept: 'All' });
        else if (type === 'atRisk') setProjectsFilter({ status: 'At Risk / Delayed', stage: 'All', priority: 'All', dept: 'All' });
        else if (type === 'avgProgress') setProjectsFilter({ status: 'All', stage: 'All', priority: 'All', dept: 'All' });
        setActiveTab('projects');
      }, []);

      // Restore session on mount
      useEffect(() => {
        const restore = async () => {
          try {
            const token = localStorage.getItem('pad_auth_token');
            const userRaw = localStorage.getItem('pad_auth_user');
            if (token && userRaw) {
              window.__authToken = token;
              if (DEMO_MODE) {
                const user = JSON.parse(userRaw);
                const found = mockUsers.find(u => u.id === user.id || u.username === user.username);
                mockCurrentUser = found || user;
                setCurrentUser(user);
                setIsLoggedIn(true);
              } else {
                // Validate the stored token with the backend before restoring the UI.
                const me = await api.auth.me();
                if (me && me.user) {
                  const user = { ...me.user, name: me.user.name || me.user.full_name };
                  setCurrentUser(user);
                  setIsLoggedIn(true);
                }
              }
            }
          } catch (e) {
            console.error('Failed to restore session', e);
            window.__authToken = null;
            try {
              localStorage.removeItem('pad_auth_token');
              localStorage.removeItem('pad_auth_user');
            } catch (err) {}
          }
        };
        restore();
      }, []);

      // Listen for backend session expiry and return to the login screen.
      useEffect(() => {
        const onSessionExpired = () => {
          setCurrentUser(null);
          setIsLoggedIn(false);
          window.__authToken = null;
        };
        window.addEventListener('pad:session-expired', onSessionExpired);
        return () => window.removeEventListener('pad:session-expired', onSessionExpired);
      }, []);

      // Load initial data
      useEffect(() => {
        if (isLoggedIn) {
          loadProjects();
          loadUsers();
          loadActivity();
          loadDepartments();
        }
      }, [isLoggedIn]);

      // Show onboarding on first login
      useEffect(() => {
        if (isLoggedIn) {
          try {
            if (!localStorage.getItem('pad_onboarding_seen')) {
              setShowTour(true);
            }
          } catch (e) {}
        }
      }, [isLoggedIn]);

      const loadProjects = async () => {
        try {
          const data = await api.projects.list({});
          setProjects(data);
        } catch (err) { console.error('Load projects error:', err); }
      };

      const loadUsers = async () => {
        if (currentUser?.role !== 'admin') return;
        try {
          const data = await api.users.list();
          setUsers(data);
        } catch (err) { console.error('Load users error:', err); }
      };

      const loadActivity = async () => {
        try {
          const data = await api.activity.list();
          setActivity(data);
        } catch (err) { console.error('Load activity error:', err); }
      };

      const loadDepartments = async () => {
        try {
          const data = await api.departments.list();
          setDepartments(data);
        } catch (err) { console.error('Load departments error:', err); }
      };

      const handleLogin = async (username, password) => {
        try {
          setLoginLoading(true);
          const result = await api.auth.login(username, password);
          window.__authToken = result.token;
          const user = { ...result.user, name: result.user.name || result.user.full_name };
          try {
            localStorage.setItem('pad_auth_token', result.token);
            localStorage.setItem('pad_auth_user', JSON.stringify(user));
          } catch (e) {}
          setCurrentUser(user);
          setIsLoggedIn(true);
          setLoginError('');
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = () => {
        setLogoutConfirm(true);
      };

      const handleConfirmLogout = async () => {
        try { await api.auth.logout(); } catch (e) {}
        try {
          localStorage.removeItem('pad_auth_token');
          localStorage.removeItem('pad_auth_user');
        } catch (e) {}
        window.__authToken = null;
        setCurrentUser(null);
        setIsLoggedIn(false);
        setLogoutConfirm(false);
      };

      const openModal = (type, item = null) => {
        setModalType(type);
        setEditingItem(item);
        setModalOpen(true);
      };

      const closeModal = () => {
        setModalOpen(false);
        setModalType(null);
        setEditingItem(null);
      };

      const handleSaveProject = (project) => {
        setConfirmSave(project);
      };

      const handleConfirmSaveProject = async () => {
        if (!confirmSave) return;
        setSaveBusy(true);
        try {
          if (confirmSave.id) {
            await api.projects.update(confirmSave.id, confirmSave);
          } else {
            await api.projects.create(confirmSave);
          }
          setConfirmSave(null);
          closeModal();
          await loadProjects();
          await loadActivity();
        } catch (err) {
          alert(err.message);
        } finally {
          setSaveBusy(false);
        }
      };

      const handleDeleteProject = async (id) => {
        await api.projects.delete(id);
        await loadProjects();
        await loadActivity();
        setDeleteConfirm(null);
      };

      const handleSaveUser = async (user) => {
        try {
          if (user.id) {
            await api.users.update(user.id, user);
          } else {
            await api.users.create(user);
          }
          await loadUsers();
          closeModal();
        } catch (err) {
          alert(err.message);
        }
      };

      const handleDeleteUser = async (id) => {
        await api.users.delete(id);
        await loadUsers();
        setDeleteConfirm(null);
      };

      const handleUpdateProfile = async (updates) => {
        const user = currentUser;
        const nextName = (updates.full_name || '').trim() || user.name || user.full_name || '';
        const updated = { ...user, ...updates, name: nextName, full_name: nextName };
        if (DEMO_MODE) {
          const idx = mockUsers.findIndex(u => u.id === user.id || u.username === user.username);
          if (idx !== -1) mockUsers[idx] = { ...mockUsers[idx], ...updates, full_name: nextName };
          mockCurrentUser = { ...(mockCurrentUser || (idx !== -1 ? mockUsers[idx] : null) || user), ...updates, full_name: nextName };
        }
        try {
          localStorage.setItem('pad_auth_user', JSON.stringify(updated));
        } catch (e) {}
        setCurrentUser(updated);
      };

      const isAdmin = currentUser?.role === 'admin';

      const modalContent = () => {
        switch (modalType) {
          case 'project':
            return <ProjectForm project={editingItem} onSave={handleSaveProject} onCancel={closeModal} departments={departments} currentUser={currentUser} isAdmin={isAdmin} />;
          case 'user':
            return <UserForm user={editingItem} onSave={handleSaveUser} onCancel={closeModal} departments={departments} />;
          default:
            return null;
        }
      };

      const modalTitle = () => {
        if (modalType === 'project') return editingItem ? 'Edit Project' : 'New Project';
        if (modalType === 'user') return editingItem ? 'Edit User' : 'Create User';
        return '';
      };

      const tabTitles = {
        dashboard: { title: 'Dashboard', subtitle: currentUser ? `Welcome back, ${currentUser.name}` : '' },
        projects: { title: 'Projects', subtitle: 'Manage automation workflows' },
        reports: { title: 'Reports', subtitle: 'Analytics & insights' },
        users: { title: 'Users', subtitle: 'Team management' },
        settings: { title: 'Settings', subtitle: 'Preferences & configuration' }
      };
      const currentTabMeta = tabTitles[activeTab] || tabTitles.dashboard;

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-primary-600 via-primary-700 to-teal-600 flex items-center justify-center p-4">
            <div className="animate-fade-in w-full max-w-md">
              <div className="bg-white rounded-2xl shadow-2xl p-8">
                <div className="flex items-center justify-center gap-3 mb-8">
                  <img src="logo.jpg" alt="YSU" className="w-12 h-12 rounded-xl shadow-lg" />
                  <div>
                    <h1 className="text-xl font-bold text-slate-800 leading-tight">Process Automation</h1>
                    <p className="text-xs text-slate-400 leading-tight">Monitoring Dashboard</p>
                  </div>
                </div>
                {loginError && (
                  <div className="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-lg text-sm text-rose-700 flex items-center gap-2 animate-fade-in">
                    <ICONS.Alert className="w-4 h-4 flex-shrink-0" /> {loginError}
                  </div>
                )}
                <form onSubmit={(e) => { e.preventDefault(); handleLogin(e.target.username.value, e.target.password.value); }} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <div className="relative">
                      <ICONS.User className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input name="username" type="text" required className="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Enter username" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <div className="relative">
                      <ICONS.Lock className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input name="password" type="password" required className="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Enter password" />
                    </div>
                  </div>
                  <button type="submit" disabled={loginLoading} className="w-full py-2.5 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-400 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-primary-500/25 flex items-center justify-center gap-2">
                    {loginLoading ? <><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin-slow" /> Signing in...</> : 'Sign In'}
                  </button>
                </form>
                <div className="mt-4">
                  <button onClick={() => setShowBackendConfig(!showBackendConfig)} className="text-xs text-slate-400 hover:text-primary-600 flex items-center gap-1 mx-auto transition">
                    <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    {showBackendConfig ? 'Hide' : 'Backend URL'}
                  </button>
                  {showBackendConfig && (
                    <div className="mt-2 p-3 bg-slate-50 rounded-lg border border-slate-100 animate-fade-in">
                      <p className="text-[10px] text-slate-400 mb-1.5">Set your backend API URL (e.g., NAS or cloud server)</p>
                      <input
                        type="text"
                        value={backendUrl}
                        onChange={e => setBackendUrl(e.target.value)}
                        placeholder="https://your-api-server/api"
                        className="w-full px-2.5 py-1.5 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-primary-500"
                      />
                      <div className="flex gap-2 mt-2">
                        <button
                          onClick={() => { if (backendUrl) { localStorage.setItem('pad_api_url', backendUrl); window.location.reload(); } }}
                          className="flex-1 py-1 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-[10px] font-medium transition"
                        >Save & Reload</button>
                        <button
                          onClick={() => { localStorage.removeItem('pad_api_url'); setBackendUrl(''); window.location.reload(); }}
                          className="flex-1 py-1 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-lg text-[10px] font-medium transition"
                        >Reset</button>
                      </div>
                      <p className="text-[10px] text-slate-400 mt-1.5">Current: <span className="font-mono text-slate-500">{API_BASE}</span></p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="app-shell bg-slate-50">
          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            currentUser={currentUser}
            onLogout={handleLogout}
            onToggleAI={() => setAiPanelOpen(!aiPanelOpen)}
            aiOpen={aiPanelOpen}
            mobileOpen={mobileMenuOpen}
            onCloseMobile={() => setMobileMenuOpen(false)}
          />
          <div className="flex flex-col flex-1 min-w-0">
            <MobileHeader
              currentUser={currentUser}
              onMenuClick={() => setMobileMenuOpen(true)}
              onToggleAI={() => setAiPanelOpen(!aiPanelOpen)}
              aiOpen={aiPanelOpen}
              title={currentTabMeta.title}
              subtitle={currentTabMeta.subtitle}
            />
            <main className="main-scroll bg-slate-50 flex-1">
              <div className="p-4 sm:p-5 lg:p-6 max-w-7xl mx-auto">
                {activeTab === 'dashboard' && <DashboardView projects={projects} activity={activity} currentUser={currentUser} onKpiClick={handleKpiClick} />}
              {activeTab === 'projects' && (
                <ProjectsView
                  isAdmin={isAdmin}
                  currentUser={currentUser}
                  onEdit={p => openModal('project', p)}
                  onDelete={id => { setDeleteConfirm(id); setDeleteType('project'); }}
                  onAdd={() => openModal('project')}
                  departments={departments}
                  projects={projects}
                  presetFilter={projectsFilter}
                  onFilterChange={setProjectsFilter}
                />
              )}
              {activeTab === 'users' && isAdmin && (
                <UsersView
                  onEditUser={u => openModal('user', u)}
                  onDeleteUser={id => { setDeleteConfirm(id); setDeleteType('user'); }}
                  onAddUser={() => openModal('user')}
                  departments={departments}
                  users={users}
                />
              )}
              {activeTab === 'reports' && <ReportsView projects={projects} />}
              {activeTab === 'settings' && <SettingsView currentUser={currentUser} isAdmin={isAdmin} onUpdateProfile={handleUpdateProfile} />}
              </div>
            </main>
          </div>

          <AIAgentPanel
            isOpen={aiPanelOpen}
            onClose={() => setAiPanelOpen(false)}
            projects={projects}
            activity={activity}
            departments={departments}
            currentUser={currentUser}
          />

          <Modal isOpen={modalOpen} onClose={closeModal} title={modalTitle()} wide={modalType === 'project'}>
            {modalContent()}
          </Modal>

          <Modal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="Confirm Delete">
            <div className="space-y-4">
              <p className="text-sm text-slate-600">Are you sure you want to delete this {deleteType}? This action cannot be undone.</p>
              <div className="flex justify-end gap-3">
                <button onClick={() => setDeleteConfirm(null)} className="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Cancel</button>
                <button onClick={() => deleteType === 'project' ? handleDeleteProject(deleteConfirm) : handleDeleteUser(deleteConfirm)} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-medium transition shadow-sm">Delete {deleteType === 'project' ? 'Project' : 'User'}</button>
              </div>
            </div>
          </Modal>

          <ConfirmDialog
            isOpen={!!confirmSave}
            onClose={() => setConfirmSave(null)}
            title={confirmSave?.id ? 'Update Project' : 'Create Project'}
            message={`Are you sure you want to ${confirmSave?.id ? 'update' : 'create'} this project?`}
            confirmText={confirmSave?.id ? 'Update Project' : 'Create Project'}
            confirmVariant="primary"
            onConfirm={handleConfirmSaveProject}
            busy={saveBusy}
          />

          <ConfirmDialog
            isOpen={logoutConfirm}
            onClose={() => setLogoutConfirm(false)}
            title="Sign Out"
            message="Are you sure you want to sign out?"
            confirmText="Sign Out"
            confirmVariant="rose"
            onConfirm={handleConfirmLogout}
          />

          <OnboardingTour
            isOpen={showTour}
            onComplete={handleTourComplete}
            steps={tourSteps}
          />

          {isLoggedIn && (
            <button
              data-tour="help-button"
              onClick={() => setShowTour(true)}
              className="fixed bottom-5 right-5 z-50 w-12 h-12 rounded-full bg-primary-600 hover:bg-primary-700 text-white shadow-lg flex items-center justify-center transition tap-target"
              aria-label="Start tour"
              title="Start tour"
            >
              <ICONS.HelpCircle className="w-6 h-6" />
            </button>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
