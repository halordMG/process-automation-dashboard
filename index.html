            teal: { 50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a' }

  <style>

      --text-lg: clamp(18px, 4vw, 22px);
      --text-xl: clamp(22px, 5vw, 26px);

<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>
  <script type="text/babel" data-presets="pad-react">
    const { useState, useMemo, useEffect, useCallback, useRef } = React;

    // ============================================================
    // API CONFIG — Supports GitHub Pages + external backend (NAS, Render, etc.)
    // Usage: add ?api=http://your-nas-ip:3001/api to URL once, or set via localStorage
    // ============================================================
    const IS_FIREBASE_HOSTING = location.hostname.endsWith('.web.app') || location.hostname.endsWith('.firebaseapp.com');
    const IS_GITHUB_PAGES = location.hostname.endsWith('.github.io');
    // When served from the ECS/nginx backend (or local dev), always use the REST API instead of Firestore/mock data.
    const IS_LIVE_BACKEND = !(IS_FIREBASE_HOSTING || IS_GITHUB_PAGES);

    const API_BASE = (() => {
      try {
        // Live backend deployments should never use a saved pad_api_url (e.g. localhost from old env.js).
        if (IS_LIVE_BACKEND) {
          localStorage.removeItem('pad_api_url');
        }
        const urlParams = new URLSearchParams(window.location.search);
        const paramApi = urlParams.get('api');
        if (paramApi) {
          localStorage.setItem('pad_api_url', paramApi);
          history.replaceState(null, '', window.location.pathname);
          return paramApi;
        }
        const saved = localStorage.getItem('pad_api_url');
        if (saved) return saved;
      } catch (e) {}
      return `${window.location.protocol}//${window.location.host}/api`;
    })();

    function hasExplicitDemoFlag() {
      try {
        // Live backend deployments should never use demo mode, even if an old flag is in localStorage.
        if (IS_LIVE_BACKEND) {
          localStorage.removeItem('pad_demo_mode');
          return false;
        }
        const urlParams = new URLSearchParams(window.location.search);
        const paramDemo = urlParams.get('demo');
        if (paramDemo === '1' || paramDemo === 'true') {
          localStorage.setItem('pad_demo_mode', '1');
          history.replaceState(null, '', window.location.pathname);
          return true;
        }
        if (paramDemo === '0' || paramDemo === 'false') {
          localStorage.removeItem('pad_demo_mode');
          history.replaceState(null, '', window.location.pathname);
          return false;
        }
        return localStorage.getItem('pad_demo_mode') === '1';
      } catch (e) { return false; }
    }

    // Firebase compat initialization
    const firebaseConfig = (typeof window !== 'undefined' && window.ENV && window.ENV.FIREBASE_CONFIG) || {};
    let firestore = null;
    try {
      if (firebaseConfig.apiKey) {
        firebase.initializeApp(firebaseConfig);
        firestore = firebase.firestore();
      }
    } catch (e) { console.error('[Firebase] Init failed:', e); }

    let DEMO_MODE = !IS_LIVE_BACKEND && (!firestore || hasExplicitDemoFlag());

    async function sha256(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    const STAGES = ['Discovery', 'Design', 'Build', 'Test', 'Deploy', 'Maintenance & Iteration'];
    const PRIORITIES = ['Low', 'Medium', 'High', 'Critical'];

    function getProjectStage(p) {
      if (!p) return 'Discovery';
      if (p.status === 'Completed') return 'Maintenance & Iteration';
      return p.stage || 'Discovery';
    }
    const DEPARTMENTS = ['InFlex (IT Team)', 'AILabU (YFS Sales Team)', 'HRWonders (HR Team)', 'Quantum (CH Accounting)', 'VJCarie (Finance Team)', 'O.T.O.G (TMU Operations Team)', 'Mighty Movers (Supply Chain Team)', 'MOKI (MKI Team)', 'Brandify (Trade Marketing)'];

    // ============================================================
    // DEMO DATA & MOCK API — Fallback when ?demo=1 or Firebase unavailable
    // ============================================================
    const importedBackup = (() => {
      try {
        const raw = localStorage.getItem('pad_imported_backup');
        if (raw) return JSON.parse(raw);
      } catch (e) { console.error('Failed to parse imported backup', e); }
      return null;
    })();
    const backup = importedBackup || ((typeof window !== 'undefined' && window.PAD_BACKUP_DATA) ? window.PAD_BACKUP_DATA : null);
    let mockCurrentUser = null;
    const mockDepartments = backup ? backup.departments : DEPARTMENTS.map((department_name, i) => ({ id: i + 1, department_name }));
    const mockOwner = backup
      ? (backup.users.find(u => u.username === 'admin') || backup.users[0])
      : { id: 1, username: 'admin', full_name: 'Admin User', role: 'admin', department_id: 1, department_name: DEPARTMENTS[0] };
    let mockUsers = backup ? backup.users : [
      { ...mockOwner },
      { id: 2, username: 'harold', full_name: 'Harold Bumanlag', role: 'user', department_id: 1, department_name: DEPARTMENTS[0] }
    ];
    let mockProjects = backup ? backup.projects : [
      { id: 1, project_name: 'Workflow Automation A', description: 'Automate invoice processing', stage: 'Build', status: 'On Track', priority: 'High', department_id: 1, department_name: DEPARTMENTS[0], owner_id: 1, owner_name: 'Admin User', start_date: '2026-06-01', due_date: '2026-07-15', progress: 65, created_at: '2026-06-01T00:00:00Z' },
      { id: 2, project_name: 'HR Onboarding Portal', description: 'Digital onboarding for new hires', stage: 'Design', status: 'At Risk', priority: 'Critical', department_id: 3, department_name: DEPARTMENTS[2], owner_id: 1, owner_name: 'Admin User', start_date: '2026-06-05', due_date: '2026-08-01', progress: 30, created_at: '2026-06-05T00:00:00Z' },
      { id: 3, project_name: 'Sales Dashboard', description: 'Real-time sales analytics', stage: 'Test', status: 'On Track', priority: 'Medium', department_id: 2, department_name: DEPARTMENTS[1], owner_id: 1, owner_name: 'Admin User', start_date: '2026-06-10', due_date: '2026-07-30', progress: 80, created_at: '2026-06-10T00:00:00Z' }
    ];
    let mockActivity = backup ? backup.activity : [
      { id: 1, action: 'Created project', target: 'Workflow Automation A', user_name: 'Admin User', created_at: '2026-06-26T07:00:00Z' },
      { id: 2, action: 'Updated stage', target: 'HR Onboarding Portal', user_name: 'Admin User', created_at: '2026-06-26T06:30:00Z' }
    ];
    const mockNextId = (arr) => arr.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;

    async function mockRequest(endpoint, options = {}) {
      await new Promise(r => setTimeout(r, 150));
      const [path, qs] = endpoint.split('?');
      const method = (options.method || 'GET').toUpperCase();
      const body = options.body ? (typeof options.body === 'string' ? JSON.parse(options.body) : options.body) : null;
      const current = mockCurrentUser || mockOwner;

      if (path === '/auth/login' && method === 'POST') {
        const user = mockUsers.find(u => u.username === body.username) || mockOwner;
        mockCurrentUser = user;
        return { token: 'demo-token', user: { id: user.id, username: user.username, name: user.full_name, full_name: user.full_name, role: user.role, department_id: user.department_id } };
      }
      if (path === '/auth/me') return { user: current };
      if (path === '/auth/logout') { mockCurrentUser = null; return {}; }

      if (path === '/dashboard/stats') {
        const total = mockProjects.length;
        const deployed = mockProjects.filter(p => getProjectStage(p) === 'Maintenance & Iteration').length;
        const atRisk = mockProjects.filter(p => p.status === 'At Risk' || p.status === 'Delayed').length;
        const avgProgress = total ? Math.round(mockProjects.reduce((a, p) => a + (p.progress || 0), 0) / total) : 0;
        const totalDepartments = new Set(mockProjects.map(p => p.department_id).filter(Boolean)).size;
        return { total, deployed, atRisk, avgProgress, totalDepartments };
      }
      if (path === '/dashboard/by-stage') {
        const counts = {};
        STAGES.forEach(s => counts[s] = 0);
        mockProjects.forEach(p => { const s = getProjectStage(p); if (counts[s] !== undefined) counts[s]++; });
        return STAGES.map(stage => ({ stage, count: counts[stage] }));
      }
      if (path === '/dashboard/by-department') {
        const counts = {};
        mockDepartments.forEach(d => counts[d.department_name] = 0);
        mockProjects.forEach(p => { if (counts[p.department_name] !== undefined) counts[p.department_name]++; });
        return Object.entries(counts).map(([department_name, count]) => ({ department_name, count }));
      }

      if (path === '/projects') {
        if (method === 'GET') {
          const params = new URLSearchParams(qs || '');
          let list = [...mockProjects];
          const dept = params.get('department');
          if (dept) list = list.filter(p => String(p.department_id) === dept);
          const stage = params.get('stage');
          if (stage) list = list.filter(p => getProjectStage(p) === stage);
          const priority = params.get('priority');
          if (priority) list = list.filter(p => p.priority === priority);
          const status = params.get('status');
          if (status) list = list.filter(p => p.status === status);
          const search = params.get('search');
          if (search) {
            const s = search.toLowerCase();
            list = list.filter(p => (p.project_name || '').toLowerCase().includes(s) || (p.owner_name || '').toLowerCase().includes(s));
          }
          if (current.role !== 'admin') {
            list = list.filter(p => String(p.owner_id) === String(current.id) || String(p.department_id) === String(current.department_id));
          }
          return list;
        }
        if (method === 'POST') {
          const dept = mockDepartments.find(d => d.id == body.department_id);
          const owner = current.role === 'admin'
            ? (mockUsers.find(u => u.full_name === body.owner_name) || current)
            : current;
          const newProject = {
            ...body,
            id: mockNextId(mockProjects),
            created_at: new Date().toISOString(),
            department_id: dept ? dept.id : (body.department_id || owner.department_id),
            department_name: dept ? dept.department_name : (body.department_name || owner.department_name),
            owner_id: owner.id,
            owner_name: owner.full_name
          };
          mockProjects.push(newProject);
          mockActivity.unshift({ id: mockNextId(mockActivity), action: 'Created project', target: newProject.project_name, user_name: current.full_name, created_at: new Date().toISOString() });
          return newProject;
        }
      }
      const projectMatch = path.match(/^\/projects\/(\d+)$/);
      if (projectMatch) {
        const id = parseInt(projectMatch[1], 10);
        if (method === 'GET') return mockProjects.find(p => p.id === id);
        if (method === 'PUT') {
          const idx = mockProjects.findIndex(p => p.id === id);
          if (idx === -1) throw new Error('Project not found');
          if (current.role !== 'admin' && mockProjects[idx].owner_id !== current.id) {
            throw new Error('Permission denied: you can only update your own projects');
          }
          const dept = mockDepartments.find(d => d.id == body.department_id);
          const owner = current.role === 'admin'
            ? (mockUsers.find(u => u.full_name === body.owner_name) || mockUsers.find(u => u.id === mockProjects[idx].owner_id) || current)
            : (mockUsers.find(u => u.id === mockProjects[idx].owner_id) || current);
          mockProjects[idx] = {
            ...mockProjects[idx],
            ...body,
            id,
            department_id: dept ? dept.id : (body.department_id || mockProjects[idx].department_id),
            department_name: dept ? dept.department_name : (body.department_name || mockProjects[idx].department_name),
            owner_id: owner.id,
            owner_name: owner.full_name
          };
          mockActivity.unshift({ id: mockNextId(mockActivity), action: 'Updated project', target: mockProjects[idx].project_name, user_name: current.full_name, created_at: new Date().toISOString() });
          return mockProjects[idx];
        }
        if (method === 'DELETE') {
          if (current.role !== 'admin') throw new Error('Permission denied: only admins can delete projects');
          mockProjects = mockProjects.filter(p => p.id !== id);
          return {};
        }
      }

      if (path === '/users') {
        if (method === 'GET') return [...mockUsers];
        if (method === 'POST') {
          const dept = mockDepartments.find(d => d.id == body.department_id);
          const newUser = { ...body, id: mockNextId(mockUsers), department_name: dept ? dept.department_name : body.department_name };
          mockUsers.push(newUser);
          return newUser;
        }
      }
      const userMatch = path.match(/^\/users\/(\d+)$/);
      if (userMatch) {
        const id = parseInt(userMatch[1], 10);
        if (method === 'GET') return mockUsers.find(u => u.id === id);
        if (method === 'PUT') {
          const idx = mockUsers.findIndex(u => u.id === id);
          if (idx === -1) throw new Error('User not found');
          const dept = mockDepartments.find(d => d.id == body.department_id);
          mockUsers[idx] = { ...mockUsers[idx], ...body, id, department_name: dept ? dept.department_name : (body.department_name || mockUsers[idx].department_name) };
          return mockUsers[idx];
        }
        if (method === 'DELETE') {
          mockUsers = mockUsers.filter(u => u.id !== id);
          return {};
        }
      }

      if (path === '/activity') return [...mockActivity];
      if (path === '/departments') return [...mockDepartments];
      if (path === '/settings/email') return method === 'POST' ? { success: true } : {};

      throw new Error('Not implemented in demo mode: ' + endpoint);
    }

    // ============================================================
    // API SERVICE — Firestore-first with demo fallback
    // ============================================================
    function getCurrentUser() {
      try {
        const raw = localStorage.getItem('pad_auth_user');
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    }

    function generateToken() {
      return 'pad-' + Math.random().toString(36).slice(2) + '-' + Date.now();
    }

    async function logActivity({ project_id = null, user_id = null, user_name = '', action_type = '', description = '' }) {
      if (!firestore) return;
      try {
        await firestore.collection('activity').add({
          project_id,
          user_id,
          user_name,
          action_type,
          description,
          created_at: new Date().toISOString()
        });
      } catch (e) { console.error('[Firestore] Activity log failed:', e); }
    }

    async function resolveOwner(ownerName) {
      if (!firestore || !ownerName) return null;
      try {
        const snap = await firestore.collection('users').where('full_name', '==', ownerName).limit(1).get();
        if (!snap.empty) return snap.docs[0].id;
        const all = await firestore.collection('users').get();
        const match = all.docs.find(d => {
          const data = d.data();
          return (data.full_name || data.name) === ownerName;
        });
        if (match) return match.id;
      } catch (e) {}
      return null;
    }

    const api = {
      async request(endpoint, options = {}) {
        if (DEMO_MODE || !firestore) return mockRequest(endpoint, options);
        const token = window.__authToken;
        const url = `${API_BASE}${endpoint}`;
        const config = {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
            ...options.headers
          }
        };
        if (config.body && typeof config.body === 'object') config.body = JSON.stringify(config.body);
        const response = await fetch(url, config);
        if (!response.ok) {
          const error = await response.json().catch(() => ({ error: 'Network error' }));
          if (response.status === 401) {
            // Stale or server-reset token — clear session so the user can log in again.
            try {
              localStorage.removeItem('pad_auth_token');
              localStorage.removeItem('pad_auth_user');
            } catch (e) {}
            window.__authToken = null;
            window.dispatchEvent(new Event('pad:session-expired'));
          }
          throw new Error(error.error || `HTTP ${response.status}`);
        }
        return response.json();
      },
      // Always call the backend (no DEMO_MODE fallback). Used for features only available server-side.
      async rawRequest(endpoint, options = {}) {
        const token = window.__authToken;
        const url = `${API_BASE}${endpoint}`;
        const config = {
          ...options,
          headers: {
            ...(options.body ? { 'Content-Type': 'application/json' } : {}),
            ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
            ...options.headers
          }
        };
        if (config.body && typeof config.body === 'object') config.body = JSON.stringify(config.body);
        const response = await fetch(url, config);
        if (!response.ok) {
          const error = await response.json().catch(() => ({ error: 'Network error' }));
          throw new Error(error.error || `HTTP ${response.status}`);
        }
        return response;
      },
      auth: {
        async login(username, password) {
          if (DEMO_MODE || !firestore) return mockRequest('/auth/login', { method: 'POST', body: { username, password } });
          // Live backend deployments must use the REST API; do not fall back to Firestore on failure.
          const result = await api.request('/auth/login', { method: 'POST', body: { username, password } });
          if (result && result.token) {
            const user = { ...result.user, name: result.user.name || result.user.full_name };
            window.__authToken = result.token;
            localStorage.setItem('pad_auth_token', result.token);
            localStorage.setItem('pad_auth_user', JSON.stringify(user));
            return { token: result.token, user };
          }
          throw new Error('Login failed: invalid response from server');
        },
        // Kept for non-live deployments; not used when IS_LIVE_BACKEND is true.
        async _firestoreLogin(username, password, backendError) {
          try {
            const hash = await sha256(password);
            const snap = await firestore.collection('users')
              .where('username', '==', username)
              .where('password_hash', '==', hash)
              .where('is_active', '==', 1)
              .limit(1)
              .get();
            if (snap.empty) throw new Error(backendError ? backendError.message : 'Invalid username or password');
            const doc = snap.docs[0];
            const user = doc.data();
            const sessionUser = {
              id: doc.id,
              username,
              full_name: user.full_name,
              name: user.full_name,
              email: user.email,
              role: user.role,
              department_id: user.department_id
            };
            const token = generateToken();
            window.__authToken = token;
            localStorage.setItem('pad_auth_token', token);
            localStorage.setItem('pad_auth_user', JSON.stringify(sessionUser));
            await logActivity({
              project_id: null,
              user_id: sessionUser.id,
              user_name: sessionUser.full_name,
              action_type: 'login',
              description: sessionUser.full_name + ' logged in via web'
            });

    function getPriorityColor(p) {
      switch(p) {
        case 'Critical': return 'bg-rose-100 text-rose-700 border-rose-200';
        case 'High': return 'bg-orange-100 text-orange-700 border-orange-200';
        case 'Medium': return 'bg-amber-100 text-amber-700 border-amber-200';
        case 'Low': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
        default: return 'bg-slate-100 text-slate-700 border-slate-200';
      }
    }

    function getStatusColor(s) {
      switch(s) {
        case 'On Track': return 'bg-teal-100 text-teal-700';
        case 'At Risk': return 'bg-amber-100 text-amber-700';
        case 'Delayed': return 'bg-rose-100 text-rose-700';
        case 'Completed': return 'bg-blue-100 text-blue-700';
        default: return 'bg-slate-100 text-slate-700';
      }
    }

    function getStageColor(stage) {
      const idx = STAGES.indexOf(stage);
      const colors = ['bg-blue-400','bg-indigo-400','bg-violet-400','bg-fuchsia-400','bg-teal-400','bg-emerald-400'];
      return colors[idx] || 'bg-slate-400';
    }

    function getProgressColor(p) {
      if (p >= 80) return 'bg-emerald-500';
      if (p >= 50) return 'bg-blue-500';
      if (p >= 25) return 'bg-amber-500';
      return 'bg-rose-500';
    }

    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const match = dateStr.toString().match(/^(\d{4}-\d{2}-\d{2})/);
      const d = match ? new Date(match[1] + 'T00:00:00') : new Date(dateStr);
      if (isNaN(d.getTime())) return null;
      const now = new Date();
      return Math.ceil((d - now) / (1000 * 60 * 60 * 24));
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const match = dateStr.toString().match(/^(\d{4}-\d{2}-\d{2})/);
      const d = match ? new Date(match[1] + 'T00:00:00') : new Date(dateStr);
      if (isNaN(d.getTime())) return '-';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function exportProjectsExcel(projects, filename = 'projects-export.xlsx') {

      if (!XLSX) return alert('Excel library not loaded');

        'Project Name': p.project_name || '',
        'Department': p.department_name || '',
        'Owner': p.owner_name || '',
        'Stage': getProjectStage(p),
        'Progress (%)': p.progress || 0,
        'Status': p.status || '',
        'Priority': p.priority || '',
        'Start Date': p.start_date || '',
        'Due Date': p.due_date || '',
        'Description': p.description || ''
      }));
      const ws = XLSX.utils.json_to_sheet(rows);

      const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });

      const atRisk = projects.filter(p => p.status === 'At Risk' || p.status === 'Delayed').length;
      const avgProgress = total ? Math.round(projects.reduce((a, p) => a + (p.progress || 0), 0) / total) : 0;

    function BarGraph({ data, title, showGrid = true, barRadius = 4 }) {
      const [hovered, setHovered] = useState(null);
      const [tooltip, setTooltip] = useState({ visible: false, x: 0, y: 0, text: '' });
      const svgRef = React.useRef(null);

      const margin = { top: 30, right: 20, bottom: 50, left: 45 };
      const width = 600;
      const height = 280;
      const chartW = width - margin.left - margin.right;
      const chartH = height - margin.top - margin.bottom;

      const values = data.map(d => d.value || d.count || 0);
      const maxValue = Math.max(...values, 1);
      const yMax = Math.ceil(maxValue * 1.15);
      const yTicks = 5;

      const barWidth = Math.min(60, (chartW / data.length) * 0.6);
      const barGap = (chartW / data.length);

      const yScale = (val) => chartH - (val / yMax) * chartH;
      const xPos = (i) => margin.left + i * barGap + (barGap - barWidth) / 2;

      const handleMouseEnter = (e, d, i) => {
        setHovered(i);
        const rect = svgRef.current.getBoundingClientRect();
        setTooltip({
          visible: true,
          x: e.clientX - rect.left + 10,
          y: e.clientY - rect.top - 30,
          text: `${d.fullLabel || d.label}: ${d.value || d.count || 0} projects`
        });
      };

      const handleMouseLeave = () => {
        setHovered(null);
        setTooltip(prev => ({ ...prev, visible: false }));
      };

      return (
        <div className="relative w-full" style={{ minHeight: height }}>
          <svg ref={svgRef} viewBox={`0 0 ${width} ${height}`} className="w-full h-auto" preserveAspectRatio="xMidYMid meet">
            {/* Grid lines */}
            {showGrid && Array.from({ length: yTicks + 1 }).map((_, i) => {
              const y = margin.top + (chartH / yTicks) * i;
              const val = Math.round(yMax - (yMax / yTicks) * i);
              return (
                <g key={`grid-${i}`}>
                  <line x1={margin.left} y1={y} x2={width - margin.right} y2={y} stroke="#e2e8f0" strokeWidth="1" strokeDasharray="3,3" />
                  <text x={margin.left - 8} y={y + 4} textAnchor="end" className="text-[10px]" fill="#94a3b8">{val}</text>
                </g>
              );
            })}

            {/* Y axis label */}
            <text x={15} y={margin.top - 10} textAnchor="middle" className="text-[10px] font-medium" fill="#64748b">Projects</text>

            {/* Bars */}
            {data.map((d, i) => {
              const barH = chartH - yScale(d.value || d.count || 0);
              const x = xPos(i);
              const y = yScale(d.value || d.count || 0);
              const isHovered = hovered === i;
              return (
                <g key={i} className="bar-animate" style={{ animationDelay: `${i * 80}ms` }}>
                  <rect
                    x={x} y={y} width={barWidth} height={barH}
                    rx={barRadius} ry={barRadius}
                    fill={d.color || '#0ea5e9'}
                    className="bar-rect"
                    opacity={isHovered ? 1 : 0.85}
                    onMouseEnter={(e) => handleMouseEnter(e, d, i)}
                    onMouseMove={(e) => handleMouseEnter(e, d, i)}
                    onMouseLeave={handleMouseLeave}
                  />
                  {/* Value label on top */}
                  <text x={x + barWidth / 2} y={y - 6} textAnchor="middle" className="text-[11px] font-bold" fill="#475569">
                    {d.value || d.count || 0}
                  </text>
                </g>
              );
            })}

            {/* X axis line */}
            <line x1={margin.left} y1={height - margin.bottom} x2={width - margin.right} y2={height - margin.bottom} stroke="#cbd5e1" strokeWidth="1.5" />

            {/* X axis labels */}
            {data.map((d, i) => (
              <text key={`xlabel-${i}`} x={xPos(i) + barWidth / 2} y={height - margin.bottom + 18} textAnchor="middle" className="text-[10px] font-medium" fill="#64748b">
                {d.label}
              </text>
            ))}

            {/* X axis title */}
            {title && (
              <text x={width / 2} y={height - 8} textAnchor="middle" className="text-[10px] font-medium" fill="#94a3b8">{title}</text>
            )}
          </svg>

          {/* Tooltip */}
          <div
            className={`chart-tooltip ${tooltip.visible ? 'visible' : ''}`}
            style={{ left: tooltip.x, top: tooltip.y }}
          >
            {tooltip.text}
          </div>
        </div>
      );
    }

    function normalizeDate(dateStr) {

        if (project) {
          return {
            ...project,
            start_date: normalizeDate(project.start_date),
            due_date: normalizeDate(project.due_date)
          };
        }
        const defaultDept = departments.find(d => d.department_name === currentUser?.department_name || d.id === currentUser?.department_id);
        return {
          department_id: defaultDept?.id || departments[0]?.id || 1,
          project_name: '',
          owner_name: isAdmin ? '' : (currentUser?.name || currentUser?.full_name || ''),
          stage: 'Discovery',
          progress: 0,
          start_date: new Date().toLocaleDateString('en-CA'),
          due_date: '',
          priority: 'Medium',
          status: 'On Track',
          description: ''
        };
      });

      const handleChange = (field, value) => {
        setForm(prev => {
          const next = { ...prev, [field]: value };
          if (field === 'status') {
            if (value === 'Completed') {
              next.stage = 'Maintenance & Iteration';
              next.progress = 100;
            } else if (prev.status === 'Completed' && prev.stage === 'Maintenance & Iteration') {
              next.stage = 'Deploy';
              next.progress = !project ? 80 : next.progress;
            }
          }
          if (field === 'stage') {
            const idx = STAGES.indexOf(value);
            if (!project) next.progress = Math.round(((idx + 1) / STAGES.length) * 100);
            if (value === 'Maintenance & Iteration') {
              next.status = 'Completed';
              next.progress = 100;
            }
          }
          return next;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.project_name?.trim() || !form.owner_name?.trim()) return;
        onSave(form);
      };

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div className="md:col-span-2">
              <label className="block text-sm font-medium text-slate-700 mb-1">Project Name *</label>
              <input type="text" required value={form.project_name || ''} onChange={e => handleChange('project_name', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Enter project name" />
            </div>

                {departments.map(d => <option key={d.id} value={d.id}>{d.department_name}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Owner *</label>
              <input type="text" required value={form.owner_name || ''} onChange={e => handleChange('owner_name', e.target.value)} disabled={!isAdmin} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm disabled:bg-slate-50 disabled:text-slate-500" placeholder={isAdmin ? 'Project owner name' : 'Auto-assigned to you'} />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Current Stage</label>
              <select value={form.stage || 'Discovery'} onChange={e => handleChange('stage', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm bg-white">
                {STAGES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Priority</label>

              <div className="flex items-center gap-3">
                <input type="range" min="0" max="100" value={form.progress || 0} onChange={e => handleChange('progress', parseInt(e.target.value))} className="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-primary-600" />
                <span className="text-sm font-semibold text-slate-700 w-12 text-right">{form.progress || 0}%</span>
              </div>
              <div className="flex gap-1 mt-2">
                {STAGES.map((s, i) => (
                  <button key={s} type="button" onClick={() => {
                    handleChange('stage', s);
                    handleChange('progress', Math.round(((i + 1) / STAGES.length) * 100));
                  }} className={`flex-1 text-xs py-1 rounded-md transition ${
                    i <= STAGES.indexOf(form.stage || 'Discovery') ? `${getStageColor(s)} text-white` : 'bg-slate-100 text-slate-400 hover:bg-slate-200'
                  }`}>{s}</button>
                ))}
              </div>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Status</label>
              <select value={form.status || 'On Track'} onChange={e => handleChange('status', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm bg-white">
                {['On Track', 'At Risk', 'Delayed', 'Completed'].map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Description</label>
            <textarea value={form.description || ''} onChange={e => handleChange('description', e.target.value)} rows={2} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm resize-none" placeholder="Brief project description..." />
          </div>
          <div className="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-2 border-t border-slate-100">
            <button type="button" onClick={onCancel} className="w-full sm:w-auto px-4 py-2.5 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition tap-target">Cancel</button>
            <button type="submit" className="w-full sm:w-auto px-4 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition shadow-sm tap-target">{project ? 'Update Project' : 'Create Project'}</button>
          </div>
        </form>
      );
    }

    function UserForm({ user, onSave, onCancel, departments }) {
      const [form, setForm] = useState(user || { username: '', password: '', full_name: '', email: '', role: 'user', department_id: departments[0]?.id || 1 });
      const [showPw, setShowPw] = useState(false);
      const [confirmPw, setConfirmPw] = useState('');

      const handleChange = (field, value) => setForm(prev => ({ ...prev, [field]: value }));

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!user && form.password !== confirmPw) {
          alert('Passwords do not match');
          return;
        }
        if (!user && !form.password) {
          alert('Password is required');
          return;
        }
        onSave(form);
      };

      return (
        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Username *</label>
              <input type="text" required value={form.username || ''} onChange={e => handleChange('username', e.target.value)} disabled={!!user} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm disabled:bg-slate-50" placeholder="Enter username" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Full Name *</label>
              <input type="text" required value={form.full_name || ''} onChange={e => handleChange('full_name', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder="Enter full name" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
              <input type="email" value={form.email || ''} onChange={e => handleChange('email', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder="email@company.com" />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Role</label>
              <select value={form.role || 'user'} onChange={e => handleChange('role', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                <option value="admin">Admin</option>
                <option value="user">User</option>
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Department</label>
              <select value={form.department_id || departments[0]?.id || 1} onChange={e => handleChange('department_id', parseInt(e.target.value))} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm bg-white">
                {departments.map(d => <option key={d.id} value={d.id}>{d.department_name}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-700 mb-1">Password {user && <span className="text-slate-400 font-normal">(leave blank to keep)</span>}</label>
              <div className="relative">
                <input type={showPw ? 'text' : 'password'} value={form.password || ''} onChange={e => handleChange('password', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder={user ? 'Leave blank' : 'Enter password'} />
                <button type="button" onClick={() => setShowPw(!showPw)} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><ICONS.Eye className="w-4 h-4" /></button>
              </div>
            </div>
            {!user && (
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                <input type={showPw ? 'text' : 'password'} value={confirmPw} onChange={e => setConfirmPw(e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 text-sm" placeholder="Confirm password" />
              </div>
            )}
          </div>
          <div className="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-2 border-t border-slate-100">
            <button type="button" onClick={onCancel} className="w-full sm:w-auto px-4 py-2.5 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition tap-target">Cancel</button>
            <button type="submit" className="w-full sm:w-auto px-4 py-2.5 bg-primary-600 hover:bg-primary-700 text-white rounded-lg text-sm font-medium transition shadow-sm tap-target">{user ? 'Update User' : 'Create User'}</button>
          </div>
        </form>
      );
    }

    function MobileHeader({ currentUser, onMenuClick, onToggleAI, aiOpen, title, subtitle }) {
      return (
        <header className="lg:hidden bg-white border-b border-slate-200 flex items-center justify-between px-4 shrink-0" style={{ minHeight: 'var(--header-h)', paddingTop: 'var(--safe-top)' }}>
          <div className="flex items-center gap-3 min-w-0 flex-1">
            <button onClick={onMenuClick} className="tap-target w-10 h-10 flex items-center justify-center rounded-lg text-slate-600 hover:bg-slate-100 transition" aria-label="Open menu">
              <ICONS.Menu className="w-6 h-6" />
            </button>
            <div className="min-w-0">
              <h1 className="font-bold text-slate-800 text-base leading-tight truncate">{title}</h1>
              {subtitle && <p className="text-xs text-slate-400 truncate">{subtitle}</p>}
            </div>
          </div>
          <div className="flex items-center gap-1">
            <button onClick={onToggleAI} className={`tap-target w-10 h-10 flex items-center justify-center rounded-lg transition ${aiOpen ? 'bg-violet-50 text-violet-700' : 'text-slate-500 hover:bg-slate-100'}`} aria-label="AI Assistant">
              <ICONS.Sparkles className="w-5 h-5" />
            </button>
            <div className="w-8 h-8 rounded-full bg-gradient-to-br from-primary-500 to-teal-500 flex items-center justify-center text-white text-xs font-bold">
              {currentUser.name?.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase()}
            </div>
          </div>

      );
    }

    function Sidebar({ activeTab, setActiveTab, currentUser, onLogout, onToggleAI, aiOpen, mobileOpen, onCloseMobile }) {
      const isUser = currentUser.role === 'user';
      const items = [
        { id: 'dashboard', label: 'Dashboard', icon: ICONS.Dashboard, roles: ['admin', 'user'] },
        { id: 'projects', label: 'Projects', icon: ICONS.Projects, roles: ['admin', 'user'] },
        { id: 'reports', label: 'Reports', icon: ICONS.Reports, roles: ['admin', 'user'] },
        { id: 'users', label: 'Users', icon: ICONS.Users, roles: ['admin'] },
        { id: 'settings', label: 'Settings', icon: ICONS.Settings, roles: ['admin', 'user'] },
      ];

      const logoHeader = (
        <div className="p-4 lg:p-5 border-b border-slate-100 flex items-center gap-3">
          <img src="logo.jpg" alt="YSU" className="w-9 h-9 rounded-lg shadow-sm" />
          <div>
            <h1 className="font-bold text-slate-800 text-sm leading-tight">Process Auto</h1>
            <p className="text-[10px] text-slate-400 leading-tight">Monitoring Dashboard</p>
          </div>
        </div>
      );

      const sidebarContent = (
        <>
          {logoHeader}
          <nav className="flex-1 p-3 space-y-1 overflow-y-auto">
            {items.filter(item => item.roles.includes(currentUser.role)).map(item => (
              <button key={item.id} data-tour={item.id} onClick={() => { setActiveTab(item.id); if (onCloseMobile) onCloseMobile(); }} className={`w-full flex items-center gap-3 px-3 py-3 lg:py-2.5 rounded-lg text-sm font-medium transition tap-target ${
                activeTab === item.id ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-50'
              }`}>
                <item.icon className={`w-5 h-5 ${activeTab === item.id ? 'text-primary-600' : 'text-slate-400'}`} />

              </button>
            ))}
            <div className="pt-2 mt-2 border-t border-slate-100">
              <button data-tour="ai-assistant" onClick={() => { onToggleAI(); if (onCloseMobile) onCloseMobile(); }} className={`w-full flex items-center gap-3 px-3 py-3 lg:py-2.5 rounded-lg text-sm font-medium transition tap-target ${
                aiOpen ? 'bg-gradient-to-r from-violet-50 to-fuchsia-50 text-violet-700' : 'text-slate-600 hover:bg-slate-50'
              }`}>
                <ICONS.Sparkles className={`w-5 h-5 ${aiOpen ? 'text-violet-600' : 'text-slate-400'}`} />
                AI Assistant
                <span className="ml-auto text-[10px] px-1.5 py-0.5 rounded-full bg-violet-100 text-violet-700 font-semibold">Beta</span>
              </button>
            </div>
          </nav>
          <div className="p-4 border-t border-slate-100">
            <div className="flex items-center gap-3 mb-3">
              <div className="w-9 h-9 rounded-full bg-gradient-to-br from-primary-500 to-teal-500 flex items-center justify-center text-white text-sm font-bold shadow-sm">
                {currentUser.name?.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase()}
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-sm font-medium text-slate-700 truncate">{currentUser.name}</p>
                <div className="flex items-center gap-1.5">
                  <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${currentUser.role === 'admin' ? 'bg-primary-100 text-primary-700' : 'bg-slate-100 text-slate-500'}`}>
                    {currentUser.role === 'admin' ? 'Admin' : 'User'}
                  </span>
                </div>
              </div>
            </div>
            <button onClick={() => { onLogout(); if (onCloseMobile) onCloseMobile(); }} className="w-full flex items-center gap-2 px-3 py-3 lg:py-2 rounded-lg text-sm font-medium text-rose-600 hover:bg-rose-50 transition tap-target">
              <ICONS.Logout className="w-4 h-4" /> Sign Out
            </button>
          </div>

      );

      return (
        <>
          <aside className="hidden lg:flex w-60 bg-white border-r border-slate-200 flex-col h-screen sticky top-0">
            {sidebarContent}
          </aside>
          <div className={`fixed inset-0 bg-black/40 z-40 lg:hidden drawer-backdrop ${mobileOpen ? 'open' : ''}`} onClick={onCloseMobile} />
          <aside className={`fixed inset-y-0 left-0 z-50 w-[280px] bg-white shadow-2xl flex flex-col lg:hidden mobile-drawer ${mobileOpen ? 'open' : ''}`}>
            <div className="flex items-center justify-end p-2 border-b border-slate-100">
              <button onClick={onCloseMobile} className="tap-target w-10 h-10 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100" aria-label="Close menu">
                <ICONS.Close className="w-5 h-5" />
              </button>
            </div>
            {sidebarContent}
          </aside>
        </>
      );
    }

    function KpiCards({ projects, onKpiClick }) {
      const kpis = useMemo(() => {
        const total = projects.length;
        const completed = projects.filter(p => p.status === 'Completed').length;
        const atRisk = projects.filter(p => p.status === 'At Risk' || p.status === 'Delayed').length;
        const avgProgress = total ? Math.round(projects.reduce((a, p) => a + (p.progress || 0), 0) / total) : 0;
        const totalDepartments = new Set(projects.map(p => p.department_id).filter(Boolean)).size;
        return { total, completed, atRisk, avgProgress, totalDepartments };
      }, [projects]);

      return (
        <div data-tour="kpis" className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div onClick={() => onKpiClick && onKpiClick('total')} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md hover:border-primary-200 transition tap-target" role="button" aria-label="View all projects">
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm text-slate-500 font-medium">Total Projects</span>
              <div className="w-9 h-9 rounded-lg bg-primary-50 flex items-center justify-center"><ICONS.FileText className="w-5 h-5 text-primary-600" /></div>
            </div>
            <div className="text-3xl font-bold text-slate-800">{kpis.total}</div>
            <div className="mt-2 text-xs text-slate-400">Across {kpis.totalDepartments || 0} departments</div>
          </div>
          <div onClick={() => onKpiClick && onKpiClick('completed')} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md hover:border-emerald-200 transition tap-target" role="button" aria-label="View completed projects">
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm text-slate-500 font-medium">Completed</span>
              <div className="w-9 h-9 rounded-lg bg-emerald-50 flex items-center justify-center"><ICONS.Check className="w-5 h-5 text-emerald-600" /></div>
            </div>
            <div className="text-3xl font-bold text-slate-800">{kpis.completed}</div>
            <div className="mt-2 text-xs text-emerald-600 font-medium">{kpis.total > 0 ? Math.round((kpis.completed / kpis.total) * 100) : 0}% completion rate</div>
          </div>
          <div onClick={() => onKpiClick && onKpiClick('avgProgress')} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md hover:border-teal-200 transition tap-target" role="button" aria-label="View all projects by progress">
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm text-slate-500 font-medium">Avg Progress</span>
              <div className="w-9 h-9 rounded-lg bg-teal-50 flex items-center justify-center"><ICONS.TrendUp className="w-5 h-5 text-teal-600" /></div>
            </div>
            <div className="text-3xl font-bold text-slate-800">{kpis.avgProgress || 0}%</div>
            <div className="mt-2 w-full bg-slate-100 rounded-full h-1.5">
              <div className={`h-1.5 rounded-full transition-all ${getProgressColor(kpis.avgProgress || 0)}`} style={{ width: `${kpis.avgProgress || 0}%` }}></div>
            </div>
          </div>
          <div onClick={() => onKpiClick && onKpiClick('atRisk')} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md hover:border-rose-200 transition tap-target" role="button" aria-label="View at risk and delayed projects">
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm text-slate-500 font-medium">At Risk / Delayed</span>
              <div className="w-9 h-9 rounded-lg bg-rose-50 flex items-center justify-center"><ICONS.Alert className="w-5 h-5 text-rose-600" /></div>
            </div>
            <div className="text-3xl font-bold text-slate-800">{kpis.atRisk}</div>
            <div className="mt-2 text-xs text-rose-500 font-medium">Need attention</div>
          </div>
        </div>
      );
    }

    function DashboardView({ projects, activity, currentUser, onKpiClick }) {
      const isAdmin = currentUser?.role === 'admin';
      const stageData = useMemo(() => STAGES.map(s => ({
        label: s === 'Maintenance & Iteration' ? 'Maint' : s.slice(0, 3),
        value: projects.filter(p => getProjectStage(p) === s).length,
        color: s === 'Maintenance & Iteration' ? '#10b981' : s === 'Deploy' ? '#14b8a6' : s === 'Test' ? '#8b5cf6' : s === 'Build' ? '#6366f1' : s === 'Design' ? '#0ea5e9' : '#94a3b8'
      })), [projects]);

      const statusBreakdown = useMemo(() => {
        const map = {};
        projects.forEach(p => { map[p.status] = (map[p.status] || 0) + 1; });
        return Object.entries(map).map(([name, count]) => ({ name, count }));
      }, [projects]);

      const recentProjects = useMemo(() => [...projects].slice(0, 5), [projects]);

      const visibleActivity = useMemo(() => {
        if (isAdmin) return activity || [];
        const ownProjectIds = new Set(projects.map(p => String(p.id)));
        return (activity || []).filter(a => a.project_id && ownProjectIds.has(String(a.project_id)));
      }, [activity, projects, isAdmin]);

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="hidden lg:block">
              <h2 className="text-xl font-bold text-slate-800">Dashboard Overview</h2>
              <p className="text-sm text-slate-500">Welcome back, {currentUser.name}</p>
            </div>
          </div>

          <KpiCards projects={projects} onKpiClick={onKpiClick} />

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-100 p-5">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">Projects by Stage</h3>
              <BarGraph data={stageData.map(d => ({ ...d, fullLabel: d.label }))} title="Stage" />
            </div>
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-4">
              <h3 className="text-sm font-semibold text-slate-700 mb-3">Recent Activity</h3>
              <div className="space-y-3 max-h-[280px] overflow-y-auto scrollbar-thin pr-1">
                {visibleActivity.length === 0 && <p className="text-sm text-slate-400 py-4 text-center">No recent activity</p>}
                {visibleActivity.map(a => (
                  <div key={a.id} className="flex gap-3 pb-3 border-b border-slate-50 last:border-0 last:pb-0">
                    <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${
                      a.action_type === 'stage' ? 'bg-blue-50 text-blue-600' : a.action_type === 'progress' ? 'bg-teal-50 text-teal-600' : a.action_type === 'priority' ? 'bg-amber-50 text-amber-600' : a.action_type === 'create' ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-50 text-slate-600'
                    }`}>
                      {a.action_type === 'stage' ? <ICONS.Projects className="w-4 h-4" /> : a.action_type === 'progress' ? <ICONS.TrendUp className="w-4 h-4" /> : a.action_type === 'priority' ? <ICONS.Alert className="w-4 h-4" /> : a.action_type === 'create' ? <ICONS.Plus className="w-4 h-4" /> : <ICONS.FileText className="w-4 h-4" />}
                    </div>
                    <div className="flex-1 min-w-0">
                      <p className="text-sm text-slate-700 leading-snug">{a.description}</p>
                      <div className="flex items-center gap-2 mt-1">
                        <span className="text-xs text-slate-500">{a.user_name}</span>
                        <span className="text-xs text-slate-300">|</span>
                        <span className="text-xs text-slate-400">{a.created_at ? new Date(a.created_at).toLocaleDateString() : 'Just now'}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
            <h3 className="text-sm font-semibold text-slate-700 mb-4">Projects by Status</h3>
            <div className="space-y-3 max-w-3xl">
              {statusBreakdown.map(s => (
                <div key={s.name}>
                  <div className="flex justify-between text-sm mb-1"><span className="text-slate-600">{s.name}</span><span className="font-semibold text-slate-800">{s.count}</span></div>
                  <div className="w-full bg-slate-100 rounded-full h-2"><div className={`h-2 rounded-full ${s.name === 'On Track' ? 'bg-emerald-500' : s.name === 'At Risk' ? 'bg-amber-500' : s.name === 'Delayed' ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: `${Math.max((s.count / Math.max(...statusBreakdown.map(x => x.count), 1)) * 100, 4)}%` }}></div></div>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <h3 className="text-sm font-semibold text-slate-700">Recent Projects</h3>
              <span className="text-xs text-slate-400">Last updated</span>
            </div>

            {/* Mobile recent project cards */}
            <div className="lg:hidden divide-y divide-slate-50">
              {recentProjects.map(p => (
                <div key={p.id} className="p-4 space-y-2">
                  <div>
                    <div className="font-medium text-slate-800">{p.project_name}</div>
                    <div className="text-xs text-slate-400 truncate">{p.description}</div>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-sm">
                    <div>
                      <span className="text-xs text-slate-400">Department</span>
                      <p className="text-slate-500 text-xs truncate">{p.department_name || p.department}</p>
                    </div>
                    <div>
                      <span className="text-xs text-slate-400">Owner</span>
                      <p className="text-slate-600 text-xs truncate">{p.owner_name}</p>
                    </div>
                  </div>
                  <div className="flex items-center justify-between">
                    <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium text-white ${getStageColor(getProjectStage(p))}`}>{getProjectStage(p)}</span>
                    <div className="flex items-center gap-2">
                      <div className="w-16 bg-slate-100 rounded-full h-1.5">
                        <div className={`h-1.5 rounded-full ${getProgressColor(p.progress)}`} style={{ width: `${p.progress}%` }}></div>
                      </div>

                </button>
              </div>
            </div>
          </Modal>
        </div>
      );

                  <th className="p-3 text-left font-medium">Username</th>
                  <th className="p-3 text-left font-medium">Role</th>

                  <th className="p-3 text-left font-medium">Actions</th>

                      </div>

                    <td className="p-3 text-slate-500 font-mono text-xs">{u.username}</td>
                    <td className="p-3">
                      <span className={`inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium ${u.role === 'admin' ? 'bg-primary-100 text-primary-700' : 'bg-slate-100 text-slate-600'}`}>
                        <ICONS.Shield className="w-3 h-3 mr-1" />
                        {u.role === 'admin' ? 'Admin' : 'User'}
                      </span>
                    </td>
                    <td className="p-3 text-slate-500 text-xs">{u.department_name || u.department}</td>
                    <td className="p-3">
                      <div className="flex items-center gap-1.5">

                        {u.role !== 'admin' && <button onClick={() => onDeleteUser(u.id)} className="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Delete"><ICONS.Trash className="w-4 h-4" /></button>}
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function ReportsView({ projects }) {
      const [deptData, setDeptData] = useState([]);
      const [loading, setLoading] = useState(true);

      const loadData = useCallback(async () => {
        try {
          const depts = await api.dashboard.byDepartment();
          setDeptData(depts);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { loadData(); }, [loadData]);

      const stageBreakdown = useMemo(() => STAGES.map(s => ({ name: s, count: projects.filter(p => getProjectStage(p) === s).length })), [projects]);
      const statusBreakdown = useMemo(() => {
        const map = {};
        projects.forEach(p => { map[p.status] = (map[p.status] || 0) + 1; });
        return Object.entries(map).map(([name, count]) => ({ name, count }));
      }, [projects]);

      if (loading) return <LoadingSpinner message="Loading reports..." />;

      const reportData = { projects, deptData, stageBreakdown, statusBreakdown };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <h2 className="text-xl font-bold text-slate-800">Reports & Analytics</h2>
            <ExportDropdown
              label="Export"
              options={[
                { label: 'Excel (.xlsx)', onClick: () => exportReportsExcel(reportData, 'reports-analytics.xlsx') },
                { label: 'PDF (.pdf)', onClick: () => exportReportsPDF(reportData, 'reports-analytics.pdf') }
              ]}
            />
          </div>
          <KpiCards projects={projects} />
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">By Stage</h3>
              <div className="space-y-3">
                {stageBreakdown.map(s => (
                  <div key={s.name}>
                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-600">{s.name}</span><span className="font-semibold text-slate-800">{s.count}</span></div>
                    <div className="w-full bg-slate-100 rounded-full h-2"><div className={`h-2 rounded-full ${getStageColor(s.name)}`} style={{ width: `${Math.max((s.count / Math.max(...stageBreakdown.map(x => x.count), 1)) * 100, 4)}%` }}></div></div>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">By Department</h3>
              <div className="space-y-3">
                {deptData.map(d => (
                  <div key={d.department_name}>
                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-600 truncate mr-2">{d.department_name}</span><span className="font-semibold text-slate-800">{d.count}</span></div>
                    <div className="w-full bg-slate-100 rounded-full h-2"><div className="h-2 rounded-full bg-primary-500" style={{ width: `${Math.max((d.count / Math.max(...deptData.map(x => x.count), 1)) * 100, 4)}%` }}></div></div>
                  </div>
                ))}
              </div>
            </div>
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-5">
              <h3 className="text-sm font-semibold text-slate-700 mb-4">By Status</h3>
              <div className="space-y-3">
                {statusBreakdown.map(s => (
                  <div key={s.name}>
                    <div className="flex justify-between text-sm mb-1"><span className="text-slate-600">{s.name}</span><span className="font-semibold text-slate-800">{s.count}</span></div>
                    <div className="w-full bg-slate-100 rounded-full h-2"><div className={`h-2 rounded-full ${s.name === 'On Track' ? 'bg-emerald-500' : s.name === 'At Risk' ? 'bg-amber-500' : s.name === 'Delayed' ? 'bg-rose-500' : 'bg-blue-500'}`} style={{ width: `${Math.max((s.count / Math.max(...statusBreakdown.map(x => x.count), 1)) * 100, 4)}%` }}></div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function SettingsView({ currentUser, isAdmin, onUpdateProfile }) {
      const [emailSettings, setEmailSettings] = useState(null);
      const [emailLoading, setEmailLoading] = useState(false);
      const [emailSaving, setEmailSaving] = useState(false);
      const [testEmail, setTestEmail] = useState('');
      const [testSending, setTestSending] = useState(false);
      const [testResult, setTestResult] = useState(null);
      const [overdueRecipients, setOverdueRecipients] = useState('');
      const [overdueSending, setOverdueSending] = useState(false);
      const [overdueResult, setOverdueResult] = useState(null);
      const [profileForm, setProfileForm] = useState({ full_name: currentUser?.name || currentUser?.full_name || '', email: currentUser?.email || '', newPassword: '', confirmPassword: '' });
      const [profileSaving, setProfileSaving] = useState(false);
      const [profileMessage, setProfileMessage] = useState(null);

      useEffect(() => {
        setProfileForm(prev => ({ ...prev, full_name: currentUser?.name || currentUser?.full_name || '', email: currentUser?.email || '' }));
      }, [currentUser]);

      useEffect(() => {
        if (isAdmin) loadEmailSettings();
      }, [isAdmin]);

      const loadEmailSettings = async () => {
        try {
          setEmailLoading(true);
          const data = await api.settings.email.get();
          setEmailSettings(data);
        } catch (err) {
          console.error('Load email settings error:', err);
        } finally {
          setEmailLoading(false);
        }
      };

      const saveEmailSettings = async () => {
        try {
          setEmailSaving(true);
          await api.settings.email.save(emailSettings);
          setTestResult({ type: 'success', message: 'Settings saved successfully' });
          setTimeout(() => setTestResult(null), 3000);
        } catch (err) {
          setTestResult({ type: 'error', message: err.message });
        } finally {
          setEmailSaving(false);
        }
      };

      const sendTestEmail = async () => {
        if (!testEmail) return;
        try {
          setTestSending(true);
          await api.notifications.test(testEmail);
          setTestResult({ type: 'success', message: `Test email sent to ${testEmail}` });
          setTestEmail('');
          setTimeout(() => setTestResult(null), 5000);
        } catch (err) {
          setTestResult({ type: 'error', message: err.message });
        } finally {
          setTestSending(false);
        }
      };

      const sendOverdueAlert = async () => {
        if (!overdueRecipients) return;
        try {
          setOverdueSending(true);
          const recipients = overdueRecipients.split(',').map(r => r.trim()).filter(Boolean);
          const result = await api.notifications.overdue(recipients);
          setOverdueResult({ type: 'success', message: `${result.overdueCount} overdue project(s) reported to ${recipients.length} recipient(s)` });
          setTimeout(() => setOverdueResult(null), 5000);
        } catch (err) {
          setOverdueResult({ type: 'error', message: err.message });
        } finally {
          setOverdueSending(false);
        }
      };

      const handleEmailChange = (field, value) => {
        setEmailSettings(prev => ({ ...prev, [field]: value }));
      };

      const handleProfileChange = (field, value) => setProfileForm(prev => ({ ...prev, [field]: value }));

      const handleProfileSave = async () => {
        if (profileForm.newPassword && profileForm.newPassword !== profileForm.confirmPassword) {
          setProfileMessage({ type: 'error', message: 'New passwords do not match' });
          return;
        }
        setProfileSaving(true);
        try {
          const updates = { full_name: profileForm.full_name, email: profileForm.email };
          if (profileForm.newPassword) updates.password = profileForm.newPassword;
          await onUpdateProfile(updates);
          setProfileMessage({ type: 'success', message: 'Profile updated successfully' });
          setProfileForm(prev => ({ ...prev, newPassword: '', confirmPassword: '' }));
          setTimeout(() => setProfileMessage(null), 3000);
        } catch (err) {
          setProfileMessage({ type: 'error', message: err.message });
        } finally {
          setProfileSaving(false);
        }
      };

      const fileInputRef = useRef(null);

      const [backupSettings, setBackupSettings] = useState(null);
      const [backupLoading, setBackupLoading] = useState(false);
      const [backupSaving, setBackupSaving] = useState(false);
      const [backupRunning, setBackupRunning] = useState(false);
      const [backupImporting, setBackupImporting] = useState(false);
      const [backupMessage, setBackupMessage] = useState(null);

      useEffect(() => {
        if (isAdmin) loadBackupSettings();
      }, [isAdmin]);

      const loadBackupSettings = async () => {
        try {
          setBackupLoading(true);
          const data = await api.settings.backup.get();
          setBackupSettings(data);
        } catch (err) {
          console.error('Load backup settings error:', err);
          setBackupMessage({ type: 'error', message: err.message });
        } finally {
          setBackupLoading(false);
        }
      };

      const handleBackupChange = (field, value) => {
        setBackupSettings(prev => ({ ...prev, [field]: value }));
      };

      const saveBackupSettings = async () => {
        try {
          setBackupSaving(true);
          setBackupMessage(null);
          await api.settings.backup.save(backupSettings);
          setBackupMessage({ type: 'success', message: 'Backup settings saved successfully' });
          setTimeout(() => setBackupMessage(null), 4000);
        } catch (err) {
          setBackupMessage({ type: 'error', message: err.message });
        } finally {
          setBackupSaving(false);
        }
      };

      const runBackupNow = async () => {
        try {
          setBackupRunning(true);
          setBackupMessage(null);
          const result = await api.settings.backup.run();
          setBackupMessage({ type: 'success', message: `Backup created: ${result.filename || result.message}` });
          setTimeout(() => setBackupMessage(null), 5000);
        } catch (err) {
          setBackupMessage({ type: 'error', message: err.message });
        } finally {
          setBackupRunning(false);
        }
      };

      const handleExportBackup = async () => {
        try {
          setBackupMessage(null);
          const blob = await api.settings.backup.export();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `pad-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setBackupMessage({ type: 'success', message: 'Backup downloaded successfully' });
          setTimeout(() => setBackupMessage(null), 4000);
        } catch (err) {
          setBackupMessage({ type: 'error', message: err.message });
        }
      };

      const handleImportClick = () => fileInputRef.current?.click();

      const handleImportFile = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          setBackupImporting(true);
          setBackupMessage(null);
          const text = await file.text();
          const data = JSON.parse(text);
          if (!data || typeof data !== 'object') {
            throw new Error('Invalid backup format');
          }
          await api.settings.backup.import(data);
          setBackupMessage({ type: 'success', message: 'Backup restored successfully. Reloading...' });
          setTimeout(() => window.location.reload(), 1500);
        } catch (err) {
          setBackupMessage({ type: 'error', message: 'Import failed: ' + err.message });
        } finally {
          setBackupImporting(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      };

      return (
        <div className="max-w-2xl space-y-6">
          <h2 className="text-xl font-bold text-slate-800">Settings</h2>

          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
            <div>
              <h3 className="text-sm font-semibold text-slate-700 mb-3">Account Information</h3>
              {profileMessage && (
                <div className={`p-3 rounded-lg text-sm mb-4 ${profileMessage.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                  {profileMessage.message}
                </div>
              )}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                  <input type="text" value={profileForm.full_name} onChange={e => handleProfileChange('full_name', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Your full name" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                  <input type="email" value={profileForm.email} onChange={e => handleProfileChange('email', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="email@company.com" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">New Password <span className="text-slate-400 font-normal">(optional)</span></label>
                  <input type="password" value={profileForm.newPassword} onChange={e => handleProfileChange('newPassword', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Leave blank to keep current" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Confirm New Password</label>
                  <input type="password" value={profileForm.confirmPassword} onChange={e => handleProfileChange('confirmPassword', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Confirm new password" />
                </div>
              </div>
              <div className="mt-4 p-3 bg-slate-50 rounded-lg grid grid-cols-2 gap-4">
                <div><p className="text-xs text-slate-400">Role</p><p className="text-sm font-medium text-slate-700 capitalize">{currentUser.role}</p></div>
                <div><p className="text-xs text-slate-400">Department</p><p className="text-sm font-medium text-slate-700">{currentUser.department_name || currentUser.department}</p></div>
              </div>
              <div className="pt-4 flex justify-end">
                <button onClick={handleProfileSave} disabled={profileSaving} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-400 text-white rounded-lg text-sm font-medium transition shadow-sm">
                  {profileSaving ? 'Saving...' : 'Save Profile'}
                </button>
              </div>
            </div>
          </div>

          {isAdmin && (<>
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
              <div className="flex items-center gap-2">
                <ICONS.Mail className="w-5 h-5 text-primary-600" />
                <h3 className="text-sm font-semibold text-slate-700">Email Configuration (Zoho Mail)</h3>
              </div>

              {testResult && (
                <div className={`p-3 rounded-lg text-sm ${testResult.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                  {testResult.message}
                </div>
              )}

              {emailLoading ? (
                <LoadingSpinner message="Loading email settings..." />
              ) : emailSettings ? (
                <div className="space-y-4">
                  <div className="flex items-center gap-3">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailSettings.enabled}
                        onChange={e => handleEmailChange('enabled', e.target.checked)}
                        className="w-4 h-4 text-primary-600 rounded border-slate-300 focus:ring-primary-500"
                      />
                      <span className="text-sm text-slate-700">Enable email notifications</span>
                    </label>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP Host</label>
                      <input type="text" value={emailSettings.smtpHost || ''} onChange={e => handleEmailChange('smtpHost', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="smtp.zoho.com" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP Port</label>
                      <input type="number" value={emailSettings.smtpPort || ''} onChange={e => handleEmailChange('smtpPort', parseInt(e.target.value) || 587)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="587" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP User (Email)</label>
                      <input type="text" value={emailSettings.smtpUser || ''} onChange={e => handleEmailChange('smtpUser', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="yourname@zoho.com" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP Password / App Password</label>
                      <input type="password" value={emailSettings.smtpPass || ''} onChange={e => handleEmailChange('smtpPass', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Enter password or app-specific password" />

                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">From Name</label>
                      <input type="text" value={emailSettings.fromName || ''} onChange={e => handleEmailChange('fromName', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Process Automation Dashboard" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">From Email</label>
                      <input type="email" value={emailSettings.fromEmail || ''} onChange={e => handleEmailChange('fromEmail', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="yourname@zoho.com" />

                  </div>

                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailSettings.smtpSecure}
                        onChange={e => handleEmailChange('smtpSecure', e.target.checked)}
                        className="w-4 h-4 text-primary-600 rounded border-slate-300 focus:ring-primary-500"
                      />
                      <span className="text-sm text-slate-700">Use SSL/TLS (port 465)</span>
                    </label>
                    <span className="text-[10px] text-slate-400">Uncheck for TLS on port 587</span>
                  </div>

                  <div className="pt-2 border-t border-slate-100">

                      {emailSaving ? 'Saving...' : 'Save Email Settings'}
