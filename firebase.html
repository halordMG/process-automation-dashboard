          const result = await api.notifications.overdue(recipients);
          setOverdueResult({ type: 'success', message: `${result.overdueCount} overdue project(s) reported to ${recipients.length} recipient(s)` });
          setTimeout(() => setOverdueResult(null), 5000);
        } catch (err) {
          setOverdueResult({ type: 'error', message: err.message });
        } finally {
          setOverdueSending(false);
        }
      };

      const handleEmailChange = (field, value) => {
        setEmailSettings(prev => ({ ...prev, [field]: value }));
      };

      const handleExportBackup = async () => {
        try {
          setBackupLoading(true);
          const data = await api.backup.createBackup();
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `pad-backup-${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          setBackupResult({ type: 'success', message: 'Backup downloaded successfully' });
          setTimeout(() => setBackupResult(null), 5000);
        } catch (err) {
          setBackupResult({ type: 'error', message: err.message || 'Backup failed' });
        } finally {
          setBackupLoading(false);
        }
      };

      const handleRestoreBackup = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          setRestoreLoading(true);
          const text = await file.text();
          const data = JSON.parse(text);
          if (!data._meta) throw new Error('Invalid backup file');
          await api.backup.restore(data);
          setBackupResult({ type: 'success', message: 'Database restored successfully. Please refresh the page.' });
          setTimeout(() => setBackupResult(null), 5000);
        } catch (err) {
          setBackupResult({ type: 'error', message: err.message || 'Restore failed' });
        } finally {
          setRestoreLoading(false);
          e.target.value = '';
        }
      };

      const handleSaveProfile = async () => {
        if (profileForm.password && profileForm.password !== profileForm.confirmPassword) {
          setProfileResult({ type: 'error', message: 'Passwords do not match' });
          setTimeout(() => setProfileResult(null), 3000);
          return;
        }
        try {
          setProfileSaving(true);
          const updateData = {
            full_name: profileForm.full_name,
            email: profileForm.email,
            role: currentUser.role,
            department_id: currentUser.department_id,
            is_active: 1
          };
          if (profileForm.password && profileForm.password.trim()) {
            updateData.password = profileForm.password;
          }
          const updated = await api.users.update(currentUser.id, updateData);
          // Update local session
          const updatedUser = { ...currentUser, name: profileForm.full_name, full_name: profileForm.full_name, email: profileForm.email };
          if (onUserUpdate) onUserUpdate(updatedUser);
          // Update localStorage session
          try {
            const session = JSON.parse(localStorage.getItem(TOKEN_KEY) || '{}');
            if (session.user) {
              session.user = { ...session.user, ...updatedUser };
              localStorage.setItem(TOKEN_KEY, JSON.stringify(session));
            }
          } catch (e) { /* ignore */ }
          setProfileForm(prev => ({ ...prev, password: '', confirmPassword: '' }));
          setProfileResult({ type: 'success', message: 'Profile updated successfully' });
          setTimeout(() => setProfileResult(null), 3000);
        } catch (err) {
          setProfileResult({ type: 'error', message: err.message });
          setTimeout(() => setProfileResult(null), 3000);
        } finally {
          setProfileSaving(false);
        }
      };

      return (
        <div className="max-w-2xl space-y-6">
          <h2 className="text-xl font-bold text-slate-800">Settings</h2>

          <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
            <div>
              <h3 className="text-sm font-semibold text-slate-700 mb-3">Profile Settings</h3>
              {profileResult && (
                <div className={`mb-4 p-3 rounded-lg text-sm ${profileResult.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>{profileResult.message}</div>
              )}
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                  <input type="text" value={profileForm.full_name} onChange={e => setProfileForm(p => ({ ...p, full_name: e.target.value }))} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">Email</label>
                  <input type="email" value={profileForm.email} onChange={e => setProfileForm(p => ({ ...p, email: e.target.value }))} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-400">Role</p><p className="text-sm font-medium text-slate-700 capitalize">{currentUser.role}</p></div>
                  <div className="p-3 bg-slate-50 rounded-lg"><p className="text-xs text-slate-400">Username</p><p className="text-sm font-medium text-slate-700 font-mono">{currentUser.username}</p></div>
                </div>
                <div className="border-t border-slate-100 pt-4">
                  <p className="text-xs text-slate-500 mb-3">Change Password (leave blank to keep current)</p>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">New Password</label>
                      <input type="password" value={profileForm.password} onChange={e => setProfileForm(p => ({ ...p, password: e.target.value }))} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Enter new password" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
                      <input type="password" value={profileForm.confirmPassword} onChange={e => setProfileForm(p => ({ ...p, confirmPassword: e.target.value }))} className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Confirm new password" />
                    </div>
                  </div>
                </div>
                <button onClick={handleSaveProfile} disabled={profileSaving} className="px-4 py-2 bg-primary-600 text-white text-sm font-medium rounded-lg hover:bg-primary-700 disabled:opacity-50 transition">{profileSaving ? 'Saving...' : 'Save Changes'}</button>
              </div>
            </div>
          </div>

          {isAdmin && (
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
              <div className="flex items-center gap-2">
                <ICONS.Mail className="w-5 h-5 text-primary-600" />
                <h3 className="text-sm font-semibold text-slate-700">Email Configuration (Zoho Mail)</h3>
              </div>

              {testResult && (
                <div className={`p-3 rounded-lg text-sm ${testResult.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                  {testResult.message}
                </div>
              )}

              {emailLoading ? (
                <LoadingSpinner message="Loading email settings..." />
              ) : emailSettings ? (
                <div className="space-y-4">
                  <div className="flex items-center gap-3">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailSettings.enabled}
                        onChange={e => handleEmailChange('enabled', e.target.checked)}
                        className="w-4 h-4 text-primary-600 rounded border-slate-300 focus:ring-primary-500"
                      />
                      <span className="text-sm text-slate-700">Enable email notifications</span>
                    </label>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP Host</label>
                      <input type="text" value={emailSettings.smtpHost || ''} onChange={e => handleEmailChange('smtpHost', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="smtp.zoho.com" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP Port</label>
                      <input type="number" value={emailSettings.smtpPort || ''} onChange={e => handleEmailChange('smtpPort', parseInt(e.target.value) || 587)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="587" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP User (Email)</label>
                      <input type="text" value={emailSettings.smtpUser || ''} onChange={e => handleEmailChange('smtpUser', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="yourname@zoho.com" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">SMTP Password / App Password</label>
                      <input type="password" value={emailSettings.smtpPass || ''} onChange={e => handleEmailChange('smtpPass', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Enter password or app-specific password" />
                      <p className="text-[10px] text-slate-400 mt-1">If 2FA is enabled on Zoho, use an app-specific password</p>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">From Name</label>
                      <input type="text" value={emailSettings.fromName || ''} onChange={e => handleEmailChange('fromName', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Process Automation Dashboard" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">From Email</label>
                      <input type="email" value={emailSettings.fromEmail || ''} onChange={e => handleEmailChange('fromEmail', e.target.value)} className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="yourname@zoho.com" />
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailSettings.smtpSecure}
                        onChange={e => handleEmailChange('smtpSecure', e.target.checked)}
                        className="w-4 h-4 text-primary-600 rounded border-slate-300 focus:ring-primary-500"
                      />
                      <span className="text-sm text-slate-700">Use SSL/TLS (port 465)</span>
                    </label>
                    <span className="text-[10px] text-slate-400">Uncheck for TLS on port 587</span>
                  </div>

                  <div className="pt-2 border-t border-slate-100">
                    <button onClick={saveEmailSettings} disabled={emailSaving} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-400 text-white rounded-lg text-sm font-medium transition shadow-sm">
                      {emailSaving ? 'Saving...' : 'Save Email Settings'}
                    </button>
                  </div>

                  <div className="pt-4 border-t border-slate-100 space-y-3">
                    <h4 className="text-sm font-semibold text-slate-700">Test & Send</h4>
                    <div className="flex gap-2">
                      <input type="email" value={testEmail} onChange={e => setTestEmail(e.target.value)} placeholder="Enter test email address" className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
                      <button onClick={sendTestEmail} disabled={testSending || !testEmail} className="px-4 py-2 bg-teal-600 hover:bg-teal-700 disabled:bg-slate-400 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                        <ICONS.Send className="w-4 h-4" /> {testSending ? 'Sending...' : 'Send Test'}
                      </button>
                    </div>

                    <div className="flex gap-2">
                      <input type="text" value={overdueRecipients} onChange={e => setOverdueRecipients(e.target.value)} placeholder="Overdue alert recipients (comma-separated emails)" className="flex-1 px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary-500" />
                      <button onClick={sendOverdueAlert} disabled={overdueSending || !overdueRecipients} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 disabled:bg-slate-400 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center gap-2">
                        <ICONS.Alert className="w-4 h-4" /> {overdueSending ? 'Sending...' : 'Send Overdue Alert'}
                      </button>
                    </div>
                    {overdueResult && (
                      <div className={`p-3 rounded-lg text-sm ${overdueResult.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                        {overdueResult.message}
                      </div>
                    )}
                  </div>
                </div>
              ) : (
                <p className="text-sm text-slate-400">Failed to load email settings.</p>
              )}
            </div>
          )}

          {isAdmin && (
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 p-6 space-y-6">
              <div className="flex items-center gap-2">
                <ICONS.Database className="w-5 h-5 text-primary-600" />
                <h3 className="text-sm font-semibold text-slate-700">Database Backup & Restore</h3>
              </div>

              {backupResult && (
                <div className={`p-3 rounded-lg text-sm ${backupResult.type === 'success' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                  {backupResult.message}
                </div>
              )}

              <div className="space-y-4">
                <div className="flex flex-col sm:flex-row gap-3">
                  <button onClick={handleExportBackup} disabled={backupLoading} className="px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-400 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center justify-center gap-2">
                    <ICONS.FileText className="w-4 h-4" /> {backupLoading ? 'Exporting...' : 'Export Backup'}
                  </button>
                  <label className="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-medium transition shadow-sm flex items-center justify-center gap-2 cursor-pointer disabled:bg-slate-400">
                    <ICONS.Refresh className="w-4 h-4" /> {restoreLoading ? 'Restoring...' : 'Import Backup'}
                    <input type="file" accept=".json" onChange={handleRestoreBackup} disabled={restoreLoading} className="hidden" />
                  </label>
                </div>
                <p className="text-xs text-slate-400">
                  Export creates a JSON backup of all collections (users, departments, projects, activity, email settings). Import restores data from a previously exported backup file. Existing data will be merged.
                </p>
              </div>
            </div>
          )}
        </div>
      );
    }

    function AIAgentPanel({ isOpen, onClose, projects, activity, departments, currentUser }) {
      const [messages, setMessages] = useState([
        { role: 'agent', text: `Hi ${currentUser?.name?.split(' ')[0] || 'there'}! I'm your Process Automation AI Assistant. Ask me about projects, departments, progress, or deadlines.`, time: new Date() }
      ]);
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = React.useRef(null);

      const scrollToBottom = () => messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      React.useEffect(scrollToBottom, [messages]);

      function generateResponse(text) {
        const lower = text.toLowerCase();
        const words = lower.split(/\s+/);

        // Greeting
        if (/\b(hi|hello|hey|good morning|good afternoon)\b/.test(lower)) {
          return `Hello! I'm ready to help. You can ask me things like:\n• "How many projects do we have?"\n• "Show me projects by InFlex"\n• "Which projects are overdue?"\n• "What is the average progress?"`;
        }

        // Help
        if (/\b(help|what can you do|commands)\b/.test(lower)) {
          return `Here's what I can help you with:\n• Project counts and statistics\n• Department breakdowns\n• Overdue project alerts\n• Project stage distribution\n• User and role information\n• Priority and status summaries\nJust ask in natural language!`;
        }

        // Total projects count
        if (/\b(how many|total number of|count of)\b.*\b(project|projects)\b/.test(lower) || /\b(project|projects)\b.*\b(count|total)\b/.test(lower)) {
          const total = projects.length;
          const byStage = {};
          STAGES.forEach(s => byStage[s] = projects.filter(p => p.stage === s).length);
          return `We have **${total} projects** total.\nBy stage:\n${STAGES.map(s => `• ${s}: ${byStage[s]}`).join('\n')}`;
        }

        // Projects by department
        if (/\b(departments?|teams?)\b.*\b(project|projects)\b/.test(lower) || /\b(project|projects)\b.*\b(departments?|teams?)\b/.test(lower) || /\b(show|list|what are)\b.*\b(departments?|teams?)\b/.test(lower)) {
          const depts = {};
          projects.forEach(p => { depts[p.department_name] = (depts[p.department_name] || 0) + 1; });
          const sorted = Object.entries(depts).sort((a, b) => b[1] - a[1]);
          return `Projects by department:\n${sorted.map(([d, c]) => `• ${d}: ${c} project${c > 1 ? 's' : ''}`).join('\n')}`;
        }

        // Specific department
        const deptMatch = DEPARTMENTS.find(d => lower.includes(d.toLowerCase()));
        if (deptMatch) {
          const deptProjects = projects.filter(p => p.department_name === deptMatch);
          if (deptProjects.length === 0) return `No projects found for ${deptMatch}.`;
          const avgProgress = Math.round(deptProjects.reduce((s, p) => s + (parseFloat(p.progress) || 0), 0) / deptProjects.length);
          return `${deptMatch} has **${deptProjects.length} projects**:\n${deptProjects.slice(0, 5).map(p => `• ${p.project_name} (${p.stage}, ${p.progress}%)`).join('\n')}${deptProjects.length > 5 ? '\n...and ' + (deptProjects.length - 5) + ' more.' : ''}\n\nAverage progress: **${avgProgress}%**`;
        }

        // Overdue projects
        if (/\b(overdue|late|missed|past due)\b/.test(lower)) {
          const now = new Date();
          const overdue = projects.filter(p => {
            if (!p.due_date) return false;
            const d = new Date(p.due_date);
            return d < now && p.status !== 'Completed';
          });
          if (overdue.length === 0) return `Great news! No overdue projects at the moment.`;
          return `**${overdue.length} project${overdue.length > 1 ? 's are' : ' is'} overdue**:\n${overdue.map(p => `• ${p.project_name} (Due: ${formatDate(p.due_date)}, Owner: ${p.owner_name})`).join('\n')}`;
        }

        // Average progress
        if (/\b(average|avg|mean)\b.*\b(progress|completion)\b/.test(lower) || /\b(progress|completion)\b.*\b(average|avg|mean)\b/.test(lower)) {
          if (projects.length === 0) return 'No projects to calculate progress.';
          const avg = Math.round(projects.reduce((s, p) => s + (parseFloat(p.progress) || 0), 0) / projects.length);
          const max = projects.reduce((m, p) => Math.max(m, parseFloat(p.progress) || 0), 0);
          const min = projects.reduce((m, p) => Math.min(m, parseFloat(p.progress) || 0), 100);
          return `Average progress across all projects: **${avg}%**\nHighest: **${max}%**\nLowest: **${min}%**`;
        }

        // Status breakdown
        if (/\b(status|on track|at risk|delayed|completed)\b/.test(lower)) {
          const byStatus = {};
          projects.forEach(p => { byStatus[p.status] = (byStatus[p.status] || 0) + 1; });
          return `Project status breakdown:\n${Object.entries(byStatus).map(([s, c]) => `• ${s}: ${c}`).join('\n')}`;
        }

        // Priority
        if (/\b(priority|critical|high|medium|low)\b/.test(lower)) {
          const byPriority = {};
          projects.forEach(p => { byPriority[p.priority] = (byPriority[p.priority] || 0) + 1; });
          const order = ['Critical', 'High', 'Medium', 'Low'];
          return `Projects by priority:\n${order.map(p => `• ${p}: ${byPriority[p] || 0}`).join('\n')}`;
        }

        // Recent activity
        if (/\b(recent|latest|last|activity|updates?)\b/.test(lower)) {
          const recent = activity.slice(0, 5);
          if (recent.length === 0) return 'No recent activity recorded.';
          return `Recent activity:\n${recent.map(a => `• ${a.description} (${a.user_name}, ${a.created_at ? new Date(a.created_at).toLocaleDateString() : 'Just now'})`).join('\n')}`;
        }

        // Specific project search
        const projMatch = projects.find(p => lower.includes(p.project_name.toLowerCase()) || lower.includes(p.project_name.toLowerCase().replace(/\s+/g, '')));
        if (projMatch) {
          return `**${projMatch.project_name}**\n• Department: ${projMatch.department_name}\n• Owner: ${projMatch.owner_name}\n• Stage: ${projMatch.stage}\n• Progress: ${projMatch.progress}%\n• Priority: ${projMatch.priority}\n• Status: ${projMatch.status}\n• Start: ${formatDate(projMatch.start_date)}\n• Due: ${formatDate(projMatch.due_date)}`;
        }

        // Users
        if (/\b(users?|people|team members?|staff)\b/.test(lower)) {
          return `There are currently users managing projects across ${departments.length} departments. The dashboard supports role-based access with Admin and User roles.`;
        }

        // Owner / specific person
        const ownerNames = [...new Set(projects.map(p => p.owner_name).filter(Boolean))];
        const ownerMatch = ownerNames.find(o => lower.includes(o.toLowerCase()));
        if (ownerMatch) {
          const ownerProjects = projects.filter(p => p.owner_name === ownerMatch);
          return `${ownerMatch} owns **${ownerProjects.length} project${ownerProjects.length > 1 ? 's' : ''}**:\n${ownerProjects.map(p => `• ${p.project_name} (${p.stage}, ${p.progress}%)`).join('\n')}`;
        }

        // Summary / overview
        if (/\b(summary|overview|snapshot|status report)\b/.test(lower)) {
          const total = projects.length;
          const avg = total > 0 ? Math.round(projects.reduce((s, p) => s + (parseFloat(p.progress) || 0), 0) / total) : 0;
          const overdue = projects.filter(p => p.due_date && new Date(p.due_date) < new Date() && p.status !== 'Completed').length;
          const atRisk = projects.filter(p => p.status === 'At Risk' || p.status === 'Delayed').length;
          return `**Dashboard Summary**\n• Total Projects: ${total}\n• Average Progress: ${avg}%\n• Overdue: ${overdue}\n• At Risk / Delayed: ${atRisk}\n• Departments: ${departments.length}\n• Recent Updates: ${activity.length} activities`;
        }

        return `I'm not sure I understood that. Try asking about:\n• Project counts or statistics\n• Department breakdowns\n• Overdue projects\n• Average progress\n• Specific project names\n• Recent activity`;
      }

      const handleSend = () => {
        if (!input.trim()) return;
        const userMsg = { role: 'user', text: input.trim(), time: new Date() };
        setMessages(prev => [...prev, userMsg]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          const response = generateResponse(userMsg.text);
          setMessages(prev => [...prev, { role: 'agent', text: response, time: new Date() }]);
          setIsTyping(false);
        }, 600 + Math.random() * 400);
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-y-0 right-0 z-40 w-96 bg-white border-l border-slate-200 shadow-2xl flex flex-col animate-slide-in-right">
          {/* Header */}
          <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-violet-600 to-fuchsia-600">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center">
                <ICONS.Sparkles className="w-4 h-4 text-white" />
              </div>
              <div>
                <h3 className="text-sm font-bold text-white">AI Assistant</h3>
                <p className="text-[10px] text-white/70">Process Automation Insights</p>
              </div>
            </div>
            <button onClick={onClose} className="p-1.5 rounded-lg text-white/70 hover:text-white hover:bg-white/10 transition">
              <ICONS.Close className="w-4 h-4" />
            </button>
          </div>

          {/* Messages */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50">
            {messages.map((msg, i) => (
              <div key={i} className={`flex gap-2.5 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                <div className={`w-7 h-7 rounded-full flex-shrink-0 flex items-center justify-center ${
                  msg.role === 'user' ? 'bg-primary-100 text-primary-700' : 'bg-gradient-to-br from-violet-500 to-fuchsia-500 text-white'
                }`}>
                  {msg.role === 'user' ? <ICONS.User className="w-3.5 h-3.5" /> : <ICONS.Bot className="w-3.5 h-3.5" />}
                </div>
                <div className={`max-w-[80%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-line ${
                  msg.role === 'user'
                    ? 'bg-primary-600 text-white rounded-tr-sm'
                    : 'bg-white border border-slate-100 text-slate-700 shadow-sm rounded-tl-sm'
                }`}>
                  {msg.text.split(/(\*\*.*?\*\*)/).map((part, j) =>
                    part.startsWith('**') && part.endsWith('**')
                      ? <strong key={j} className={msg.role === 'user' ? 'text-white' : 'text-slate-900'}>{part.slice(2, -2)}</strong>
                      : part
                  )}
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="flex gap-2.5">
                <div className="w-7 h-7 rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center text-white">
                  <ICONS.Bot className="w-3.5 h-3.5" />
                </div>
                <div className="bg-white border border-slate-100 px-4 py-2.5 rounded-2xl rounded-tl-sm shadow-sm">
                  <div className="flex gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 animate-bounce" style={{ animationDelay: '0ms' }} />
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 animate-bounce" style={{ animationDelay: '150ms' }} />
                    <span className="w-1.5 h-1.5 rounded-full bg-slate-300 animate-bounce" style={{ animationDelay: '300ms' }} />
                  </div>
                </div>
              </div>
            )}
            <div ref={messagesEndRef} />
          </div>

          {/* Input */}
          <div className="p-3 border-t border-slate-100 bg-white">
            <div className="flex gap-2">
              <input
                type="text"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKeyDown}
                placeholder="Ask about projects, stats, deadlines..."
                className="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-transparent"
              />
              <button
                onClick={handleSend}
                disabled={!input.trim() || isTyping}
                className="p-2.5 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 disabled:opacity-40 disabled:cursor-not-allowed text-white rounded-xl transition shadow-sm"
              >
                <ICONS.Send className="w-4 h-4" />
              </button>
            </div>
            <p className="text-[10px] text-slate-400 mt-1.5 text-center">Press Enter to send · AI responses are generated from dashboard data</p>
          </div>
        </div>
      );
    }

    function App() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [projects, setProjects] = useState([]);
      const [activity, setActivity] = useState([]);
      const [departments, setDepartments] = useState([]);
      const [modalOpen, setModalOpen] = useState(false);
      const [modalType, setModalType] = useState(null);
      const [editingItem, setEditingItem] = useState(null);
      const [deleteConfirm, setDeleteConfirm] = useState(null);
      const [deleteType, setDeleteType] = useState(null);
      const [confirmAction, setConfirmAction] = useState(null);
      const [aiPanelOpen, setAiPanelOpen] = useState(false);
      const [refreshKey, setRefreshKey] = useState(0);

      // Restore session on page load
      useEffect(() => {
        try {
          const session = JSON.parse(localStorage.getItem(TOKEN_KEY) || '{}');
          if (session.token && session.user) {
            setCurrentUser(session.user);
            setIsLoggedIn(true);
          }
        } catch (e) { /* ignore parse errors */ }
      }, []);

      // Load initial data
      useEffect(() => {
        if (isLoggedIn) {
          loadProjects();
          loadActivity();
          loadDepartments();
        }
      }, [isLoggedIn]);

      const loadProjects = async () => {
        try {
          const data = await api.projects.list({});
          const isAdmin = currentUser?.role === 'admin';
          const filtered = (!isAdmin && currentUser) ? data.filter(p => String(p.owner_id) === String(currentUser.id) || String(p.created_by) === String(currentUser.id)) : data;
          setProjects(filtered);
        } catch (err) { console.error('Load projects error:', err); }
      };

      const loadActivity = async () => {
        try {
          const data = await api.activity.list();
          setActivity(data);
        } catch (err) { console.error('Load activity error:', err); }
      };

      const loadDepartments = async () => {
        try {
          const data = await api.departments.list();
          setDepartments(data);
        } catch (err) { console.error('Load departments error:', err); }
      };

      const handleLogin = async (username, password) => {
        try {
          setLoginLoading(true);
          const result = await api.auth.login(username, password);
          window.__authToken = result.token;
          setCurrentUser({ ...result.user, name: result.user.name || result.user.full_name });
          setIsLoggedIn(true);
          setLoginError('');
        } catch (err) {
          setLoginError(err.message);
        } finally {
          setLoginLoading(false);
        }
      };

      const performLogout = async () => {
        try { await api.auth.logout(); } catch (e) {}
        window.__authToken = null;
        localStorage.removeItem(TOKEN_KEY);
        setCurrentUser(null);
        setIsLoggedIn(false);
        setConfirmAction(null);
      };

      const handleLogout = () => {
        setConfirmAction({ title: 'Sign Out', message: 'Are you sure you want to sign out?', onConfirm: performLogout, confirmLabel: 'Sign Out', danger: false });
      };

      const openModal = (type, item = null) => {
        setModalType(type);
        setEditingItem(item);
        setModalOpen(true);
      };

      const closeModal = () => {
        setModalOpen(false);
        setModalType(null);
        setEditingItem(null);
      };

      const handleSaveProject = async (project) => {
        try {
          const isAdmin = currentUser?.role === 'admin';
          // Non-admin users can only create/edit their own projects
          if (!isAdmin) {
            project.owner_id = currentUser.id;
            project.owner_name = currentUser.name || currentUser.full_name;
            project.created_by = parseInt(currentUser.id);
          }
          if (project.id) {
            await api.projects.update(project.id, project);
          } else {
            await api.projects.create(project);
          }
          await loadProjects();
          await loadActivity();
          setRefreshKey(k => k + 1);
          closeModal();
        } catch (err) {
          console.error('Save project error:', err);
          alert('Failed to save project: ' + (err.message || 'Unknown error'));
        }
      };

      const handleDeleteProject = async (id) => {
        try {
          await api.projects.delete(id);
          await loadProjects();
          await loadActivity();
          setRefreshKey(k => k + 1);
          setDeleteConfirm(null);
        } catch (err) {
          console.error('Delete project error:', err);
          alert('Failed to delete project: ' + (err.message || 'Unknown error'));
        }
      };

      const handleSaveUser = async (user) => {
        try {
          if (user.id) {
            await api.users.update(user.id, user);
          } else {
            await api.users.create(user);
          }
          // If editing the currently logged-in user, update session state
          if (currentUser && user.id === currentUser.id) {
            const updatedName = user.full_name || user.name || currentUser.name;
            const updated = { ...currentUser, name: updatedName, full_name: updatedName, email: user.email || currentUser.email, role: user.role || currentUser.role, department_id: user.department_id || currentUser.department_id };
            setCurrentUser(updated);
            // Persist to localStorage
            try {
              const session = JSON.parse(localStorage.getItem('pad_firebase_token') || '{}');
              if (session.user) {
                session.user = { ...session.user, ...updated };
                localStorage.setItem('pad_firebase_token', JSON.stringify(session));
              }
            } catch (e) { /* ignore storage errors */ }
          }
          setRefreshKey(k => k + 1);
          closeModal();
        } catch (err) {
          console.error('Save user error:', err);
          alert('Failed to save user: ' + (err.message || 'Unknown error'));
        }
      };

      const handleDeleteUser = async (id) => {
        try {
          await api.users.delete(id);
          setRefreshKey(k => k + 1);
          setDeleteConfirm(null);
        } catch (err) {
          console.error('Delete user error:', err);
          alert('Failed to delete user: ' + (err.message || 'Unknown error'));
        }
      };

      const isAdmin = currentUser?.role === 'admin';

      const modalContent = () => {
        switch (modalType) {
          case 'project':
            return <ProjectForm project={editingItem} onSave={handleSaveProject} onCancel={closeModal} departments={departments} currentUser={currentUser} isAdmin={isAdmin} />;
          case 'user':
            return <UserForm user={editingItem} onSave={handleSaveUser} onCancel={closeModal} departments={departments} />;
          default:
            return null;
        }
      };

      const modalTitle = () => {
        if (modalType === 'project') return editingItem ? 'Edit Project' : 'New Project';
        if (modalType === 'user') return editingItem ? 'Edit User' : 'Create User';
        return '';
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-primary-600 via-primary-700 to-teal-600 flex items-center justify-center p-4">
            <div className="animate-fade-in w-full max-w-md">
              <div className="bg-white rounded-2xl shadow-2xl p-8">
                <div className="flex items-center justify-center gap-3 mb-8">
                  <img src="logo.jpg" alt="YSU" className="w-12 h-12 rounded-xl shadow-lg" />
                  <div>
                    <h1 className="text-xl font-bold text-slate-800 leading-tight">Process Automation</h1>
                    <p className="text-xs text-slate-400 leading-tight">Monitoring Dashboard</p>
                  </div>
                </div>
                {loginError && (
                  <div className="mb-4 p-3 bg-rose-50 border border-rose-200 rounded-lg text-sm text-rose-700 flex items-center gap-2 animate-fade-in">
                    <ICONS.Alert className="w-4 h-4 flex-shrink-0" /> {loginError}
                  </div>
                )}
                <form onSubmit={(e) => { e.preventDefault(); handleLogin(e.target.username.value, e.target.password.value); }} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <div className="relative">
                      <ICONS.User className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input name="username" type="text" required className="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Enter username" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <div className="relative">
                      <ICONS.Lock className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                      <input name="password" type="password" required className="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm" placeholder="Enter password" />
                    </div>
                  </div>
                  <button type="submit" disabled={loginLoading} className="w-full py-2.5 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-400 text-white rounded-xl text-sm font-semibold transition shadow-lg shadow-primary-500/25 flex items-center justify-center gap-2">
                    {loginLoading ? <><div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin-slow" /> Signing in...</> : 'Sign In'}
                  </button>
                </form>
                <div className="mt-6 p-4 bg-slate-50 rounded-xl border border-slate-100">
                  <p className="text-xs font-semibold text-slate-500 mb-2">Demo Accounts:</p>
                  <div className="space-y-1 text-xs text-slate-400">
                    <p><span className="text-slate-600 font-medium">Admin:</span> admin</p>
                    <p><span className="text-slate-600 font-medium">User:</span> harold</p>
                  </div>
                  <p className="text-[10px] text-slate-400 mt-2">
                    Demo passwords are configured via SEED_ADMIN_PASSWORD and SEED_DEFAULT_PASSWORD environment variables.
                  </p>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen overflow-hidden">
          <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} currentUser={currentUser} onLogout={handleLogout} onToggleAI={() => setAiPanelOpen(!aiPanelOpen)} aiOpen={aiPanelOpen} />
          <main className="flex-1 overflow-y-auto bg-slate-50">
            <div className="p-6 max-w-7xl mx-auto">
              {activeTab === 'dashboard' && <DashboardView projects={projects} activity={activity} currentUser={currentUser} />}
              {activeTab === 'projects' && (
                <ProjectsView
                  isAdmin={isAdmin}
                  currentUser={currentUser}
                  onEdit={p => openModal('project', p)}
                  onDelete={id => { setDeleteConfirm(id); setDeleteType('project'); }}
                  onAdd={() => setConfirmAction({ title: 'New Project', message: 'Are you sure you want to create a new project?', onConfirm: () => { openModal('project'); setConfirmAction(null); }, confirmLabel: 'Create Project', danger: false })}
                  departments={departments}
                  refreshKey={refreshKey}
                />
              )}
              {activeTab === 'users' && isAdmin && (
                <UsersView
                  onEditUser={u => openModal('user', u)}
                  onDeleteUser={id => { setDeleteConfirm(id); setDeleteType('user'); }}
                  onAddUser={() => openModal('user')}
                  departments={departments}
                  refreshKey={refreshKey}
                />
              )}
              {activeTab === 'reports' && <ReportsView projects={projects} />}
              {activeTab === 'settings' && <SettingsView currentUser={currentUser} isAdmin={isAdmin} onUserUpdate={(updated) => { setCurrentUser(updated); }} />}
            </div>
          </main>

          <AIAgentPanel
            isOpen={aiPanelOpen}
            onClose={() => setAiPanelOpen(false)}
            projects={projects}
            activity={activity}
            departments={departments}
            currentUser={currentUser}
          />

          <Modal isOpen={modalOpen} onClose={closeModal} title={modalTitle()} wide={modalType === 'project'}>
            {modalContent()}
          </Modal>

          <Modal isOpen={!!deleteConfirm} onClose={() => setDeleteConfirm(null)} title="Confirm Delete">
            <div className="space-y-4">
              <p className="text-sm text-slate-600">Are you sure you want to delete this {deleteType}? This action cannot be undone.</p>
              <div className="flex justify-end gap-3">
                <button onClick={() => setDeleteConfirm(null)} className="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Cancel</button>
                <button onClick={() => deleteType === 'project' ? handleDeleteProject(deleteConfirm) : handleDeleteUser(deleteConfirm)} className="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg text-sm font-medium transition shadow-sm">Delete {deleteType === 'project' ? 'Project' : 'User'}</button>
              </div>
            </div>
          </Modal>

          <Modal isOpen={!!confirmAction} onClose={() => setConfirmAction(null)} title={confirmAction?.title || 'Confirm'}>
            <div className="space-y-4">
              <p className="text-sm text-slate-600">{confirmAction?.message}</p>
              <div className="flex justify-end gap-3">
                <button onClick={() => setConfirmAction(null)} className="px-4 py-2 border border-slate-200 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Cancel</button>
                <button onClick={() => confirmAction?.onConfirm()} className={`px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm ${confirmAction?.danger ? 'bg-rose-600 hover:bg-rose-700 text-white' : 'bg-primary-600 hover:bg-primary-700 text-white'}`}>{confirmAction?.confirmLabel || 'Confirm'}</button>
              </div>
            </div>
          </Modal>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
